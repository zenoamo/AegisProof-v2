name: Update Fastify dependency

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fastify:
    name: Update Fastify and verify fast-uri
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show current versions
        run: |
          echo "=== Current Fastify ==="
          npm ls fastify --all || true

          echo "=== Current fast-uri ==="
          npm ls fast-uri --all || true

      - name: Update Fastify within 5.x
        run: |
          npm install fastify@^5.12.5

      - name: Show changed files
        run: |
          git status --short
          git diff -- package.json package-lock.json

      - name: Verify Fastify version
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (pkg.dependencies?.fastify !== "^5.12.5") {
            console.error(
              `ERROR: Unexpected Fastify dependency: ${pkg.dependencies?.fastify}`
            );
            process.exit(1);
          }

          console.log(`Fastify dependency: ${pkg.dependencies.fastify}`);
          EOF

      - name: Verify installed dependency tree
        run: |
          echo "=== Fastify ==="
          npm ls fastify --all

          echo "=== @fastify/ajv-compiler ==="
          npm ls @fastify/ajv-compiler --all || true

          echo "=== ajv ==="
          npm ls ajv --all || true

          echo "=== fast-uri ==="
          npm ls fast-uri --all

      - name: Explain fast-uri
        run: |
          echo "=== npm explain fast-uri ==="
          npm explain fast-uri

      - name: Verify fast-uri
        run: |
          node --input-type=module <<'EOF'
          const result = await import("child_process");

          const output = result.execFileSync(
            "npm",
            ["ls", "fast-uri", "--all", "--json"],
            { encoding: "utf8" }
          );

          const tree = JSON.parse(output);

          const versions = new Set();

          function collect(node) {
            if (!node) return;

            if (node.name === "fast-uri" && node.version) {
              versions.add(node.version);
            }

            for (const child of Object.values(node.dependencies ?? {})) {
              collect(child);
            }
          }

          collect(tree);

          console.log("Installed fast-uri versions:", [...versions]);

          const vulnerable = [...versions].filter((version) =>
            version.startsWith("3.")
          );

          if (vulnerable.length > 0) {
            console.error(
              `ERROR: fast-uri 3.x still installed: ${vulnerable.join(", ")}`
            );
            process.exit(1);
          }

          console.log("OK: no fast-uri 3.x version installed.");
          EOF

      - name: Verify Frozen Core is untouched
        run: |
          if git diff --name-only | grep -E \
            '^(circuits/|artifacts/|contracts/.*production|.*\.wasm$|.*\.zkey$)' \
            >/dev/null; then
            echo "ERROR: Frozen Core files were modified."
            git diff --name-only
            exit 1
          fi

          echo "OK: Frozen Core files untouched."

      - name: Verify dependency changes only
        run: |
          changed="$(git diff --name-only)"

          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -vE \
            '^(package\.json|package-lock\.json)$' \
            | grep -q .; then
            echo "ERROR: Unexpected files were modified."
            exit 1
          fi

          echo "OK: Only package.json/package-lock.json changed."

      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git commit -m "fix(deps): update fastify to resolve fast-uri vulnerability"
          git push
