name: AegisProof Security Agent

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  secret-and-malware-heuristics:
    name: Secret and suspicious-code heuristics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect credential material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE             --exclude-dir=.git             --exclude-dir=node_modules             --exclude='*.lock'             '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})'             .; then
            echo "::error::Potential credential material detected."
            exit 1
          fi

      - name: Detect suspicious execution patterns
        shell: bash
        run: |
          set -euo pipefail
          findings=0

          while IFS= read -r pattern; do
            if grep -RInE               --exclude-dir=.git               --exclude-dir=node_modules               --exclude='*.lock'               "$pattern" .; then
              findings=1
            fi
          done <<'PATTERNS'
          (curl|wget)[[:space:]].*\|[[:space:]]*(sh|bash)
          (curl|wget)[[:space:]].*-[oO][[:space:]]*/tmp/
          base64[[:space:]]+(-d|--decode).*(sh|bash|node|python)
          (eval|Function)[[:space:]]*\(
          child_process\.(exec|execSync|spawn|spawnSync)
          PATTERNS

          if [ "$findings" -ne 0 ]; then
            echo "::warning::Suspicious execution pattern(s) detected. Review required; this job does not claim malware detection."
          fi

      - name: Inspect package lifecycle hooks
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from "node:fs";

          const files = ["package.json", "server/package.json", "packages/sdk/package.json"];

          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const scripts = pkg.scripts ?? {};
            for (const name of ["preinstall", "install", "postinstall"]) {
              if (scripts[name]) {
                console.log(`[REVIEW] ${file} -> ${name}: ${scripts[name]}`);
              }
            }
          }
          NODE

      - name: Scan tracked executable/binary files
        shell: bash
        run: |
          set -euo pipefail
          find .             -path './.git' -prune -o             -path './node_modules' -prune -o             -type f             \( -perm -111 -o -name '*.exe' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' \)             -print

  actions-audit:
    name: GitHub Actions security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit workflow files
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            echo "Auditing $file"

            if grep -q "pull_request_target" "$file"; then
              echo "::warning::$file uses pull_request_target; review untrusted-code boundaries."
            fi

            if grep -qE 'uses:[[:space:]]+[^@]+@(main|master|latest)$' "$file"; then
              echo "::error::$file uses a mutable Action reference."
              exit 1
            fi
          done

  aegisproof-integrity:
    name: AegisProof integrity regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:sensitive-files
      - run: npm run test:sensitive-files-boundary
      - run: npm run test:penetration
      - run: npm run verify:provenance -- --live
      - run: npm run test:prover-compat
      - run: npm run verify:signals

  security-summary:
    name: Security gate summary
    needs:
      - codeql
      - dependency-review
      - npm-audit
      - secret-and-malware-heuristics
      - actions-audit
      - aegisproof-integrity
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        shell: bash
        run: |
          set -euo pipefail
          echo "CodeQL: ${{ needs.codeql.result }}"
          echo "Dependency Review: ${{ needs.dependency-review.result }}"
          echo "npm audit: ${{ needs.npm-audit.result }}"
          echo "Heuristics: ${{ needs.secret-and-malware-heuristics.result }}"
          echo "Actions audit: ${{ needs.actions-audit.result }}"
          echo "AegisProof integrity: ${{ needs.aegisproof-integrity.result }}"

          for result in             "${{ needs.codeql.result }}"             "${{ needs.npm-audit.result }}"             "${{ needs.secret-and-malware-heuristics.result }}"             "${{ needs.actions-audit.result }}"             "${{ needs.aegisproof-integrity.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Security Gate failed."
              exit 1
            fi
          done

          echo "Security Gate: PASS"
