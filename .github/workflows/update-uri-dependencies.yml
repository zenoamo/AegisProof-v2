name: Update URI dependencies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update and verify URI dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Show current dependency state
        run: |
          echo "========================================"
          echo "Current dependency state"
          echo "========================================"

          echo
          echo "=== fast-uri ==="
          npm ls fast-uri --all || true

          echo
          echo "=== brace-expansion ==="
          npm ls brace-expansion --all || true

          echo
          echo "=== adm-zip ==="
          npm ls adm-zip --all || true

      - name: Record baseline files
        run: |
          git status --short

          cp package.json /tmp/package.json.before
          cp package-lock.json /tmp/package-lock.json.before

      - name: Update package-lock.json
        run: |
          npm update fast-uri brace-expansion --package-lock-only

      - name: Show package-lock.json diff
        run: |
          echo "========================================"
          echo "package-lock.json diff"
          echo "========================================"

          git diff -- package-lock.json

      - name: Verify package.json unchanged
        run: |
          if cmp -s package.json /tmp/package.json.before; then
            echo "OK: package.json was not changed."
          else
            echo "ERROR: package.json was changed."
            diff -u /tmp/package.json.before package.json || true
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci

      - name: Show installed fast-uri dependency tree
        run: |
          echo "========================================"
          echo "fast-uri dependency tree"
          echo "========================================"

          npm ls fast-uri --all

      - name: Show installed brace-expansion dependency tree
        run: |
          echo "========================================"
          echo "brace-expansion dependency tree"
          echo "========================================"

          npm ls brace-expansion --all || true

      - name: Verify fast-uri versions
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const lock = JSON.parse(
            await readFile("package-lock.json", "utf8")
          );

          const entries = Object.entries(lock.packages ?? {})
            .filter(([path]) =>
              path.endsWith("/node_modules/fast-uri")
            );

          if (entries.length === 0) {
            console.error(
              "ERROR: No fast-uri entries found in package-lock.json."
            );
            process.exit(1);
          }

          console.log("Locked fast-uri versions:");

          for (const [path, pkg] of entries) {
            console.log(`  ${path}: ${pkg.version}`);
          }

          const vulnerable = entries.filter(([, pkg]) => {
            const [major, minor, patch] =
              pkg.version.split(".").map(Number);

            return (
              major < 4 ||
              (major === 4 && minor < 2) ||
              (major === 4 && minor === 2 && patch < 1)
            );
          });

          if (vulnerable.length > 0) {
            console.error(
              "ERROR: Vulnerable fast-uri version detected."
            );

            for (const [path, pkg] of vulnerable) {
              console.error(`  ${path}: ${pkg.version}`);
            }

            process.exit(1);
          }

          console.log(
            "OK: all locked fast-uri versions are >= 4.2.1."
          );
          EOF

      - name: Verify installed fast-uri versions
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(
            await readFile(
              "node_modules/fast-uri/package.json",
              "utf8"
            )
          );

          const version = packageJson.version;

          console.log(
            `Installed fast-uri version: ${version}`
          );

          const [major, minor, patch] =
            version.split(".").map(Number);

          const patched =
            major > 4 ||
            (major === 4 && minor > 2) ||
            (major === 4 && minor === 2 && patch >= 1);

          if (!patched) {
            console.error(
              `ERROR: Vulnerable fast-uri version installed: ${version}`
            );
            process.exit(1);
          }

          console.log(
            "OK: installed fast-uri is patched."
          );
          EOF

      - name: Verify brace-expansion state
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const lock = JSON.parse(
            await readFile("package-lock.json", "utf8")
          );

          const entries = Object.entries(lock.packages ?? {})
            .filter(([path]) =>
              path.endsWith("/node_modules/brace-expansion")
            );

          if (entries.length === 0) {
            console.log(
              "INFO: brace-expansion is not present in package-lock.json."
            );

            console.log(
              "OK: no brace-expansion dependency is currently locked."
            );

            process.exit(0);
          }

          console.log("Locked brace-expansion versions:");

          for (const [path, pkg] of entries) {
            console.log(`  ${path}: ${pkg.version}`);
          }

          console.log(
            "OK: brace-expansion entries detected."
          );
          EOF

      - name: Verify adm-zip remains patched
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(
            await readFile(
              "node_modules/adm-zip/package.json",
              "utf8"
            )
          );

          const version = packageJson.version;

          console.log(
            `Installed adm-zip version: ${version}`
          );

          const [major, minor, patch] =
            version.split(".").map(Number);

          const patched =
            major === 0 &&
            minor === 6 &&
            patch >= 1;

          if (!patched) {
            console.error(
              `ERROR: adm-zip@0.6.1 or later within 0.6.x is required, found ${version}`
            );
            process.exit(1);
          }

          console.log(
            "OK: adm-zip remains patched."
          );
          EOF

      - name: Verify adm-zip dependency tree
        run: |
          npm ls adm-zip --all

      - name: Verify Hardhat
        run: |
          npm ls hardhat --depth=0

      - name: Check package.json diff
        run: |
          echo "=== package.json diff ==="

          if git diff --quiet -- package.json; then
            echo "No package.json changes."
          else
            git diff -- package.json
            exit 1
          fi

      - name: Check dependency changes
        run: |
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "package.json diff"
          echo "========================================"

          git diff -- package.json

          echo
          echo "========================================"
          echo "package-lock.json diff"
          echo "========================================"

          git diff -- package-lock.json

      - name: Ensure only package-lock.json changed
        run: |
          changed_files="$(git status --short | awk '{$1=""; sub(/^ /,""); print}')"

          if [ -z "$changed_files" ]; then
            echo "ERROR: No changes detected."
            exit 1
          fi

          echo "Changed files:"
          echo "$changed_files"

          while IFS= read -r file; do
            case "$file" in
              package-lock.json)
                ;;
              *)
                echo "ERROR: Unexpected modified file: $file"
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          echo
          echo "OK: Only package-lock.json changed."

      - name: Check Frozen Core files
        run: |
          echo "========================================"
          echo "Frozen Core protection check"
          echo "========================================"

          frozen_core_patterns=(
            "circuits/"
            "artifacts/"
            "production.zkey"
            "production.wasm"
          )

          for pattern in "${frozen_core_patterns[@]}"; do
            if git status --short | grep -F "$pattern" >/dev/null 2>&1; then
              echo "ERROR: Frozen Core related change detected: $pattern"
              git status --short
              exit 1
            fi
          done

          echo "OK: No Frozen Core related changes detected."

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "ERROR: No package-lock.json changes to commit."
            exit 1
          fi

          git commit \
            -m "fix(deps): update vulnerable URI dependencies"

      - name: Push dependency update
        run: |
          git push

      - name: Final summary
        run: |
          echo "========================================"
          echo "URI dependency update complete"
          echo "========================================"
          echo
          echo "Verified:"
          echo "  - fast-uri updated to patched version"
          echo "  - brace-expansion checked"
          echo "  - npm ci succeeded"
          echo "  - adm-zip remains patched"
          echo "  - Hardhat dependency remains valid"
          echo "  - package.json unchanged"
          echo "  - only package-lock.json changed"
          echo "  - Frozen Core unchanged"
          echo "  - package-lock.json committed and pushed"
