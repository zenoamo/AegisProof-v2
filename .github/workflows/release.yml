# Create GitHub Release when a version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pre-release verification smoke
        run: |
          npm ci
          npm run check:sensitive-files
          npm run test:phase813-gate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AegisProof ${{ github.ref_name }}
          body_path: docs/release/${{ github.ref_name }}-release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
