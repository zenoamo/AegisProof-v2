name: AegisProof Ethereum Mainnet Deployment (Local)

on:
  pull_request:
    paths:
      - "deployments/**"
      - "protocol/contracts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mainnet-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-deployment:
    name: Mainnet deployment path (local Hardhat)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile contracts
        run: npx hardhat compile

      # Reuse the repository's canonical Phase 2 verification suite.
      # This is the existing local verification path; do not replace it
      # with a second, deployment-specific crypto test implementation.
      - name: Phase 2 verification suite - FAST
        run: node scripts/phase2_verify.mjs --fast --artifact-json

      - name: Start local Hardhat node
        run: |
          nohup npx hardhat node > /tmp/aegisproof-hardhat-node.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail \
              -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --silent --fail \
            -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            http://127.0.0.1:8545 > /dev/null; then
            cat /tmp/aegisproof-hardhat-node.log
            exit 1
          fi

      - name: Run local deployment
        run: npx hardhat run scripts/deploy.ts --network localhost

      - name: Verify local deployment output
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const deployment = JSON.parse(
            fs.readFileSync("deployments/localhost.json", "utf8"),
          );

          if (deployment.network !== "localhost") {
            throw new Error(`unexpected deployment network: ${deployment.network}`);
          }

          if (deployment.chainId !== 31337) {
            throw new Error(`unexpected local chain ID: ${deployment.chainId}`);
          }

          for (const [name, address] of Object.entries({
            verifierAddress: deployment.verifierAddress,
            nullifierRegistryAddress: deployment.nullifierRegistryAddress,
            shieldAddress: deployment.shieldAddress,
          })) {
            if (!/^0x[0-9a-fA-F]{40}$/.test(address ?? "")) {
              throw new Error(`${name} is not a valid EVM address`);
            }
          }

          console.log("Local deployment manifest: PASS");
          console.log(JSON.stringify(deployment, null, 2));
          NODE

      - name: Verify deployment remains local-only
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const workflow = fs.readFileSync(
            ".github/workflows/mainnet-readiness.yml",
            "utf8",
          );

          if (/MAINNET_RPC_URL|MAINNET_PRIVATE_KEY/.test(workflow)) {
            throw new Error("workflow must not use Mainnet RPC or private-key credentials");
          }

          if (!workflow.includes("--network localhost")) {
            throw new Error("workflow must deploy only to the local Hardhat network");
          }

          console.log("Local-only deployment boundary: PASS");
          NODE

      - name: Dump local node log on failure
        if: failure()
        run: cat /tmp/aegisproof-hardhat-node.log
