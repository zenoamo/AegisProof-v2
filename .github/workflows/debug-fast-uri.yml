name: Debug fast-uri parent dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-fast-uri-parents:
    name: Inspect Fastify dependency update path
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show current dependency tree
        run: |
          echo "=== fastify ==="
          npm ls fastify --all || true

          echo "=== @fastify/ajv-compiler ==="
          npm ls @fastify/ajv-compiler --all || true

          echo "=== ajv ==="
          npm ls ajv --all || true

          echo "=== fast-uri ==="
          npm ls fast-uri --all || true

      - name: Explain dependency chain
        run: |
          echo "=== npm explain fast-uri ==="
          npm explain fast-uri || true

          echo "=== npm explain @fastify/ajv-compiler ==="
          npm explain @fastify/ajv-compiler || true

          echo "=== npm explain ajv ==="
          npm explain ajv || true

          echo "=== npm explain fastify ==="
          npm explain fastify || true

      - name: Check available Fastify versions
        run: |
          echo "=== fastify versions ==="
          npm view fastify versions --json

      - name: Check available @fastify/ajv-compiler versions
        run: |
          echo "=== @fastify/ajv-compiler versions ==="
          npm view @fastify/ajv-compiler versions --json

      - name: Check available ajv versions
        run: |
          echo "=== ajv versions ==="
          npm view ajv versions --json

      - name: Check package metadata
        run: |
          echo "=== fastify latest metadata ==="
          npm view fastify version dependencies --json

          echo "=== @fastify/ajv-compiler latest metadata ==="
          npm view @fastify/ajv-compiler version dependencies --json

          echo "=== ajv latest metadata ==="
          npm view ajv version dependencies --json

      - name: Check fast-uri versions
        run: |
          echo "=== fast-uri versions ==="
          npm view fast-uri versions --json

          echo "=== fast-uri latest metadata ==="
          npm view fast-uri version engines --json
