name: Debug server dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-server:
    name: Inspect server dependency tree
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify server project
        run: |
          test -f server/package.json
          test -f server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Show server Fastify tree
        working-directory: server
        run: |
          echo "=== fastify ==="
          npm ls fastify --all || true

          echo "=== fast-uri ==="
          npm ls fast-uri --all || true

          echo "=== @fastify/ajv-compiler ==="
          npm ls @fastify/ajv-compiler --all || true

          echo "=== ajv ==="
          npm ls ajv --all || true

      - name: Explain server fast-uri
        working-directory: server
        run: |
          echo "=== npm explain fast-uri ==="
          npm explain fast-uri || true

      - name: Explain server fastify
        working-directory: server
        run: |
          echo "=== npm explain fastify ==="
          npm explain fastify || true

      - name: Show server package versions
        working-directory: server
        run: |
          echo "=== package.json dependencies ==="
          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          console.log(JSON.stringify({
            dependencies: pkg.dependencies ?? {},
            devDependencies: pkg.devDependencies ?? {},
            overrides: pkg.overrides ?? {}
          }, null, 2));
          EOF

      - name: Show fast-uri entries in server lockfile
        working-directory: server
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const lock = JSON.parse(
            fs.readFileSync("package-lock.json", "utf8")
          );

          console.log("=== fast-uri entries ===");

          let found = false;

          for (const [path, info] of Object.entries(lock.packages ?? {})) {
            if (
              path === "node_modules/fast-uri" ||
              path.endsWith("/node_modules/fast-uri")
            ) {
              found = true;
              console.log({
                path,
                version: info.version,
                dependencies: info.dependencies
              });
            }
          }

          if (!found) {
            console.log("No fast-uri package-lock entry found.");
          }
          EOF

      - name: Verify repository unchanged
        run: |
          git status --short

          if [ -n "$(git status --short)" ]; then
            echo "ERROR: Repository was modified."
            exit 1
          fi

          echo "OK: Repository unchanged."
