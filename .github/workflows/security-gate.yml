name: AegisProof Security Gate

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "server/package.json"
      - "server/package-lock.json"
      - "scripts/**"
      - "checksums.sha256"
      - "*.wasm"
      - "*.r1cs"
      - "*.zkey"
      - "publicSignals.json"
      - ".github/**"

  push:
    branches:
      - main
      - master

  schedule:
    # Every day at 04:00 JST
    - cron: "0 19 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisproof-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # ROOT DEPENDENCY SECURITY
  # ============================================================

  root-security:
    name: Root Dependency Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # ----------------------------------------------------------
      # Lockfile integrity
      # ----------------------------------------------------------

      - name: Verify package-lock
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts

          git diff --exit-code -- package-lock.json

      # ----------------------------------------------------------
      # Deterministic install
      # ----------------------------------------------------------

      - name: npm ci
        run: |
          npm ci --ignore-scripts

      # ----------------------------------------------------------
      # fast-uri
      # ----------------------------------------------------------

      - name: Inspect fast-uri
        run: |
          echo "========================================"
          echo "fast-uri dependency tree"
          echo "========================================"

          npm ls fast-uri --all || true

          echo
          echo "========================================"
          echo "npm why fast-uri"
          echo "========================================"

          npm why fast-uri || true

      - name: fast-uri security gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const lockfile = "package-lock.json";

          if (!fs.existsSync(lockfile)) {
            console.log("package-lock.json not found.");
            process.exit(0);
          }

          const lock = JSON.parse(
            fs.readFileSync(lockfile, "utf8")
          );

          const versions = new Set();

          /*
           * npm lockfile v3
           */
          if (lock.packages) {
            for (const [path, pkg] of Object.entries(lock.packages)) {
              if (
                path.endsWith("node_modules/fast-uri") &&
                pkg.version
              ) {
                versions.add(pkg.version);
              }
            }
          }

          /*
           * Older lockfile fallback
           */
          function walk(deps) {
            if (!deps) return;

            for (const [name, dep] of Object.entries(deps)) {

              if (
                name === "fast-uri" &&
                dep.version
              ) {
                versions.add(dep.version);
              }

              walk(dep.dependencies);
            }
          }

          walk(lock.dependencies);

          const found = [...versions];

          console.log(
            "Detected fast-uri versions:",
            found
          );

          if (found.length === 0) {
            console.log(
              "fast-uri not found."
            );
            process.exit(0);
          }

          function parse(version) {
            const m = version.match(
              /^(\d+)\.(\d+)\.(\d+)/
            );

            if (!m) {
              throw new Error(
                `Invalid version: ${version}`
              );
            }

            return [
              Number(m[1]),
              Number(m[2]),
              Number(m[3])
            ];
          }

          function safe(version) {
            const [major, minor, patch] =
              parse(version);

            /*
             * Known patched baselines.
             *
             * 2.x >= 2.4.6
             * 3.x >= 3.1.7
             * 4.x >= 4.1.4
             */

            if (major === 2) {
              return (
                minor > 4 ||
                (minor === 4 && patch >= 6)
              );
            }

            if (major === 3) {
              return (
                minor > 1 ||
                (minor === 1 && patch >= 7)
              );
            }

            if (major === 4) {
              return (
                minor > 1 ||
                (minor === 1 && patch >= 4)
              );
            }

            /*
             * Fail closed for unknown major versions.
             */
            return false;
          }

          const unsafe = found.filter(
            v => !safe(v)
          );

          if (unsafe.length > 0) {

            console.error("");
            console.error(
              "========================================"
            );
            console.error(
              "FAST-URI SECURITY GATE FAILED"
            );
            console.error(
              "========================================"
            );

            console.error(
              "Unsafe versions:"
            );

            for (const version of unsafe) {
              console.error(
                `  - ${version}`
              );
            }

            console.error("");

            process.exit(1);
          }

          console.log(
            "fast-uri security gate: PASS"
          );
          NODE

      # ----------------------------------------------------------
      # npm audit
      # ----------------------------------------------------------

      - name: npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # SERVER DEPENDENCY SECURITY
  # ============================================================

  server-security:
    name: Server Dependency Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Verify server package-lock
        working-directory: server
        run: |
          npm install \
            --package-lock-only \
            --ignore-scripts

          git diff --exit-code -- package-lock.json

      - name: npm ci
        working-directory: server
        run: |
          npm ci --ignore-scripts

      # ----------------------------------------------------------
      # fast-uri
      # ----------------------------------------------------------

      - name: Inspect server fast-uri
        working-directory: server
        run: |
          echo "========================================"
          echo "server fast-uri"
          echo "========================================"

          npm ls fast-uri --all || true
          npm why fast-uri || true

      - name: Server fast-uri security gate
        working-directory: server
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const lock = JSON.parse(
            fs.readFileSync(
              "package-lock.json",
              "utf8"
            )
          );

          const versions = new Set();

          if (lock.packages) {
            for (
              const [path, pkg]
              of Object.entries(lock.packages)
            ) {
              if (
                path.endsWith("node_modules/fast-uri") &&
                pkg.version
              ) {
                versions.add(pkg.version);
              }
            }
          }

          function walk(deps) {
            if (!deps) return;

            for (
              const [name, dep]
              of Object.entries(deps)
            ) {

              if (
                name === "fast-uri" &&
                dep.version
              ) {
                versions.add(dep.version);
              }

              walk(dep.dependencies);
            }
          }

          walk(lock.dependencies);

          const found = [...versions];

          console.log(
            "Detected fast-uri:",
            found
          );

          if (found.length === 0) {
            process.exit(0);
          }

          function safe(version) {
            const m = version.match(
              /^(\d+)\.(\d+)\.(\d+)/
            );

            if (!m) {
              return false;
            }

            const major = Number(m[1]);
            const minor = Number(m[2]);
            const patch = Number(m[3]);

            if (major === 2) {
              return (
                minor > 4 ||
                (minor === 4 && patch >= 6)
              );
            }

            if (major === 3) {
              return (
                minor > 1 ||
                (minor === 1 && patch >= 7)
              );
            }

            if (major === 4) {
              return (
                minor > 1 ||
                (minor === 1 && patch >= 4)
              );
            }

            return false;
          }

          const unsafe =
            found.filter(v => !safe(v));

          if (unsafe.length) {
            console.error(
              "Unsafe fast-uri:",
              unsafe
            );
            process.exit(1);
          }

          console.log(
            "Server fast-uri gate: PASS"
          );
          NODE

      # ----------------------------------------------------------
      # npm audit
      # ----------------------------------------------------------

      - name: Server npm audit
        working-directory: server
        run: |
          npm audit --audit-level=high


  # ============================================================
  # FROZEN CORE
  # ============================================================

  frozen-core:
    name: Frozen Core Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Frozen Core is not modified
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if grep -Fxq "$path" <<<"$changed"; then
              echo "::error::Frozen Core modification detected: $path"
              exit 1
            fi
          done <<'EOF'
          crypto-artifacts/phase2/phase2/r1cs/aegis_commit_core_v2.r1cs
          crypto-artifacts/phase2/phase2/r1cs/aegis_commit_core_v2_js/aegis_commit_core_v2.wasm
          crypto-artifacts/phase4/production.zkey
          crypto-artifacts/phase4/production-vkey.json
          EOF

          echo "Frozen Core boundary: PASS"

      - name: Verify canonical artifact hashes
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const manifest = JSON.parse(
            fs.readFileSync("artifacts/provenance/manifest.json", "utf8")
          );

          for (const entry of manifest.entries ?? []) {
            if (!entry.present || !entry.path || !entry.sha256) continue;
            if (!fs.existsSync(entry.path)) {
              console.error("Missing canonical artifact:", entry.path);
              process.exit(1);
            }
            const digest = crypto
              .createHash("sha256")
              .update(fs.readFileSync(entry.path))
              .digest("hex");
            if (digest !== entry.sha256) {
              console.error("Artifact hash mismatch:", entry.path);
              console.error("Expected:", entry.sha256);
              console.error("Actual:", digest);
              process.exit(1);
            }
          }

          console.log("Canonical artifact hashes: PASS");
          NODE


  # ============================================================
  # PUBLIC SIGNALS
  # ============================================================

  public-signals:
    name: publicSignals Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical publicSignals vector
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const file = "artifacts/phase4/reports/production_proof_baseline.json";
          const expected = 30;

          if (!fs.existsSync(file)) {
            console.error("Missing canonical proof baseline:", file);
            process.exit(1);
          }

          const proof = JSON.parse(fs.readFileSync(file, "utf8"));
          const signals = proof.publicSignals;

          if (!Array.isArray(signals)) {
            console.error("production proof publicSignals must be an array");
            process.exit(1);
          }

          if (signals.length !== expected) {
            console.error("publicSignals count mismatch: expected", expected, "actual", signals.length);
            process.exit(1);
          }

          console.log("publicSignals integrity: PASS (" + signals.length + ")");
          NODE

  # ============================================================
  # T1 - T9 REGRESSION
  # ============================================================

  regression:
    name: T1-T9 Regression
    runs-on: ubuntu-latest

    needs:
      - root-security
      - server-security
      - frozen-core
      - public-signals

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: |
          npm ci --ignore-scripts

      # ----------------------------------------------------------
      # T1
      # ----------------------------------------------------------

      - name: T1
        run: |
          npm run test:T1

      # ----------------------------------------------------------
      # T2
      # ----------------------------------------------------------

      - name: T2
        run: |
          npm run test:T2

      # ----------------------------------------------------------
      # T3
      # ----------------------------------------------------------

      - name: T3
        run: |
          npm run test:T3

      # ----------------------------------------------------------
      # T4
      # ----------------------------------------------------------

      - name: T4
        run: |
          npm run test:T4

      # ----------------------------------------------------------
      # T5
      # ----------------------------------------------------------

      - name: T5
        run: |
          npm run test:T5

      # ----------------------------------------------------------
      # T6
      # ----------------------------------------------------------

      - name: T6
        run: |
          npm run test:T6

      # ----------------------------------------------------------
      # T7
      # ----------------------------------------------------------

      - name: T7
        run: |
          npm run test:T7

      # ----------------------------------------------------------
      # T8
      # ----------------------------------------------------------

      - name: T8
        run: |
          npm run test:T8

      # ----------------------------------------------------------
      # T9
      # ----------------------------------------------------------

      - name: T9
        run: |
          npm run test:T9

      # ----------------------------------------------------------
      # Final working tree check
      # ----------------------------------------------------------

      - name: Verify clean working tree
        run: |
          git diff --exit-code
