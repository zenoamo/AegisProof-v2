name: Debug adm-zip dependency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect and verify adm-zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Update package-lock.json
        run: npm install --package-lock-only

      - name: Show lockfile changes
        run: |
          echo "package-lock.json diff:"
          git diff -- package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show adm-zip dependency tree
        run: |
          echo "Installed adm-zip dependency tree:"
          npm ls adm-zip --all

      - name: Explain adm-zip
        run: |
          npm explain adm-zip

      - name: Verify installed adm-zip version
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(
            await readFile("node_modules/adm-zip/package.json", "utf8")
          );

          const version = packageJson.version;

          console.log(`Installed adm-zip version: ${version}`);

          const [major, minor, patch] = version.split(".").map(Number);

          const patched =
            major > 0 ||
            (major === 0 && minor > 6) ||
            (major === 0 && minor === 6 && patch >= 1);

          if (!patched) {
            console.error(
              `ERROR: adm-zip@0.6.1 or later is required, but found adm-zip@${version}`
            );
            process.exit(1);
          }

          console.log(
            "OK: adm-zip@0.6.1 or later is installed."
          );
          EOF

      - name: Verify package-lock.json adm-zip version
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const lock = JSON.parse(
            await readFile("package-lock.json", "utf8")
          );

          const admZip = lock.packages?.["node_modules/adm-zip"];

          if (!admZip) {
            console.error(
              "ERROR: node_modules/adm-zip entry was not found in package-lock.json."
            );
            process.exit(1);
          }

          const version = admZip.version;

          console.log(`Locked adm-zip version: ${version}`);

          const [major, minor, patch] = version.split(".").map(Number);

          const patched =
            major > 0 ||
            (major === 0 && minor > 6) ||
            (major === 0 && minor === 6 && patch >= 1);

          if (!patched) {
            console.error(
              `ERROR: package-lock.json contains vulnerable adm-zip version ${version}`
            );
            process.exit(1);
          }

          console.log(
            "OK: package-lock.json contains a patched adm-zip version."
          );
          EOF

      - name: Verify dependency tree
        run: |
          npm ls adm-zip --all

      - name: Verify Hardhat dependency
        run: |
          npm ls hardhat

      - name: Check dependency changes
        run: |
          echo "Git status:"
          git status --short

          echo
          echo "package.json diff:"
          git diff -- package.json

          echo
          echo "package-lock.json diff:"
          git diff -- package-lock.json

      - name: Ensure only dependency files changed
        run: |
          changed_files="$(git status --short | awk '{print $2}')"

          for file in $changed_files; do
            case "$file" in
              package.json|package-lock.json)
                ;;
              *)
                echo "ERROR: Unexpected modified file: $file"
                exit 1
                ;;
            esac
          done

          echo "OK: Only package.json/package-lock.json changed."

      - name: Final summary
        run: |
          echo "========================================"
          echo "adm-zip dependency verification complete"
          echo "========================================"
          echo
          echo "Expected:"
          echo "  adm-zip >= 0.6.1"
          echo
          echo "The workflow verified:"
          echo "  - package-lock.json was synchronized"
          echo "  - npm ci succeeded"
          echo "  - installed adm-zip is patched"
          echo "  - package-lock.json contains a patched version"
          echo "  - Hardhat dependency tree is valid"
          echo "  - only dependency files changed"
