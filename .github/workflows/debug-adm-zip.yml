name: Debug adm-zip dependency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show adm-zip dependency tree
        run: |
          npm ls adm-zip --all || true

      - name: Explain adm-zip
        run: |
          npm explain adm-zip || true

      - name: Show Hardhat version
        run: |
          npm ls hardhat
