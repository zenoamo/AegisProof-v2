name: Dependency Security Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-security-update
  cancel-in-progress: false

jobs:
  update:
    name: Update vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Node.js
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ============================================================
      # Root lockfile update
      # ============================================================

      - name: Update root dependency lockfile
        run: |
          npm audit fix --package-lock-only

      - name: Update root vulnerable transitive dependencies
        run: |
          npm update fast-uri underscore jsonpath bfj --package-lock-only || true

      # ============================================================
      # Server lockfile update
      # ============================================================

      - name: Update server dependency lockfile
        working-directory: server
        run: |
          npm audit fix --package-lock-only

      - name: Update server vulnerable transitive dependencies
        working-directory: server
        run: |
          npm update fast-uri underscore jsonpath bfj --package-lock-only || true

      # ============================================================
      # Lockfile consistency
      # ============================================================

      - name: Verify root lockfile
        run: |
          npm ci --dry-run

      - name: Verify server lockfile
        working-directory: server
        run: |
          npm ci --dry-run

      # ============================================================
      # Clean installation
      # ============================================================

      - name: Install root dependencies
        run: |
          npm ci

      - name: Install server dependencies
        working-directory: server
        run: |
          npm ci

      # ============================================================
      # Dependency tree
      # ============================================================

      - name: Show root security dependency tree
        run: |
          echo "=== ROOT fast-uri ==="
          npm ls fast-uri --all || true

          echo "=== ROOT elliptic ==="
          npm ls elliptic --all || true

          echo "=== ROOT underscore ==="
          npm ls underscore --all || true

          echo "=== ROOT jsonpath ==="
          npm ls jsonpath --all || true

          echo "=== ROOT bfj ==="
          npm ls bfj --all || true

      - name: Show server security dependency tree
        working-directory: server
        run: |
          echo "=== SERVER fast-uri ==="
          npm ls fast-uri --all || true

          echo "=== SERVER elliptic ==="
          npm ls elliptic --all || true

          echo "=== SERVER underscore ==="
          npm ls underscore --all || true

          echo "=== SERVER jsonpath ==="
          npm ls jsonpath --all || true

          echo "=== SERVER bfj ==="
          npm ls bfj --all || true

      # ============================================================
      # fast-uri verification
      # ============================================================

      - name: Verify patched fast-uri versions
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          function versions(cwd) {
            const result = execFileSync(
              "npm",
              ["ls", "fast-uri", "--all", "--json"],
              {
                cwd,
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"]
              }
            );

            const tree = JSON.parse(result);
            const found = new Set();

            function walk(node) {
              if (!node) return;

              if (node.name === "fast-uri" && node.version) {
                found.add(node.version);
              }

              for (const child of Object.values(node.dependencies || {})) {
                walk(child);
              }
            }

            walk(tree);
            return [...found].sort();
          }

          function patched(version) {
            const m = version.match(/^(\d+)\.(\d+)\.(\d+)$/);

            if (!m) return false;

            const major = Number(m[1]);
            const minor = Number(m[2]);
            const patch = Number(m[3]);

            if (major === 2) {
              return minor > 4 || (minor === 4 && patch >= 7);
            }

            if (major === 3) {
              return minor > 1 || (minor === 1 && patch >= 8);
            }

            if (major === 4) {
              return minor > 2 || (minor === 2 && patch >= 1);
            }

            return true;
          }

          const targets = [
            ["root", process.cwd()],
            ["server", "server"]
          ];

          let failed = false;

          for (const [name, cwd] of targets) {
            const found = versions(cwd);

            console.log(`${name} fast-uri:`, found);

            for (const version of found) {
              if (!patched(version)) {
                console.error(
                  `ERROR: vulnerable fast-uri remains: ${name} ${version}`
                );
                failed = true;
              }
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log("OK: all fast-uri versions satisfy patched minimums.");
          NODE

      # ============================================================
      # High / Critical audit gate
      #
      # elliptic GHSA-848j-6mx2-7j84 is explicitly handled as a
      # known no-fix exception. Everything else at high/critical
      # must fail the workflow.
      # ============================================================

      - name: Audit root dependencies
        run: |
          npm audit --json > root-audit.json || true

      - name: Audit server dependencies
        working-directory: server
        run: |
          npm audit --json > ../server-audit.json || true

      - name: Enforce security audit policy
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const files = [
            ["root", "root-audit.json"],
            ["server", "server-audit.json"]
          ];

          const ALLOWED_NO_FIX = "GHSA-848j-6mx2-7j84";

          let failed = false;

          function advisoryIds(via) {
            const ids = [];

            for (const item of via || []) {
              if (typeof item === "string") {
                ids.push(item);
              } else if (item && typeof item === "object") {
                if (item.url) {
                  const match = item.url.match(
                    /advisories\/(GHSA-[A-Za-z0-9-]+|CVE-[0-9-]+)/
                  );

                  if (match) {
                    ids.push(match[1]);
                  }
                }

                if (item.source) {
                  ids.push(String(item.source));
                }
              }
            }

            return ids;
          }

          for (const [scope, file] of files) {
            if (!fs.existsSync(file)) {
              console.error(`ERROR: missing audit report: ${file}`);
              failed = true;
              continue;
            }

            const report = JSON.parse(fs.readFileSync(file, "utf8"));

            console.log(`\n=== ${scope} audit ===`);

            for (const [name, vulnerability] of Object.entries(
              report.vulnerabilities || {}
            )) {
              const severity = vulnerability.severity;
              const ids = advisoryIds(vulnerability.via);

              if (!["high", "critical"].includes(severity)) {
                continue;
              }

              const onlyKnownNoFix =
                ids.length > 0 &&
                ids.every(id => id === ALLOWED_NO_FIX);

              if (onlyKnownNoFix) {
                console.warn(
                  `KNOWN NO-FIX EXCEPTION: ${scope}: ${name} -> ${ids.join(", ")}`
                );
                continue;
              }

              console.error(
                `SECURITY FAILURE: ${scope}: ${name} (${severity})`
              );
              console.error(
                `Advisories: ${ids.join(", ") || "unknown"}`
              );

              failed = true;
            }
          }

          if (failed) {
            console.error(
              "\nERROR: unresolved high/critical vulnerabilities remain."
            );
            process.exit(1);
          }

          console.log(
            "\nOK: no unresolved high/critical vulnerabilities remain outside the documented elliptic no-fix exception."
          );
          NODE

      # ============================================================
      # Frozen Core protection
      # ============================================================

      - name: Verify Frozen Core
        run: |
          changed="$(git diff --name-only)"

          echo "=== Changed files ==="
          echo "$changed"

          if echo "$changed" | grep -E \
            '^(circuits/|artifacts/|keys/|wasm/|production\.zkey|publicSignals|contracts/)' \
            >/dev/null; then
            echo "ERROR: Frozen Core was modified."
            exit 1
          fi

          echo "OK: Frozen Core untouched."

      # ============================================================
      # Changed-file boundary
      # ============================================================

      - name: Verify changed files
        run: |
          changed="$(git diff --name-only)"

          if [ -z "$changed" ]; then
            echo "No dependency changes were produced."
            exit 0
          fi

          echo "$changed"

          if echo "$changed" | grep -vE \
            '^(package\.json|package-lock\.json|server/package\.json|server/package-lock\.json)$' \
            >/dev/null; then
            echo "ERROR: Unexpected files changed."
            exit 1
          fi

          echo "OK: dependency files only."

      # ============================================================
      # Create update branch
      # ============================================================

      - name: Create update branch
        run: |
          branch="security/dependency-update-$(date +%Y%m%d-%H%M%S)"

          git checkout -b "$branch"

          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit dependency updates
        run: |
          if git diff --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            server/package.json \
            server/package-lock.json

          git commit \
            -m "fix(deps): harden dependency security"

      # ============================================================
      # Push update branch
      # ============================================================

      - name: Push update branch
        run: |
          git push --set-upstream origin "$BRANCH"

      # ============================================================
      # Create PR
      # ============================================================

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > pr-body.md <<'EOF'
          ## Dependency security update

          This PR updates vulnerable npm dependencies without modifying Frozen Core.

          ### Security checks

          - npm ci --dry-run
          - clean npm ci
          - fast-uri dependency-tree verification
          - high/critical npm audit policy
          - Frozen Core protection
          - changed-file boundary verification

          ### Known no-fix exception

          GHSA-848j-6mx2-7j84 (`elliptic`) is explicitly tracked because the
          current advisory has no patched npm release.

          This exception does not permit unrelated high/critical advisories.

          ### Frozen Core

          Verified untouched.

          ### Expected changed files

          - package.json
          - package-lock.json
          - server/package.json
          - server/package-lock.json
          EOF

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "fix(deps): harden dependency security" \
            --body-file pr-body.md
