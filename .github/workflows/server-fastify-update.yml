
name: Server Fastify Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update server Fastify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update server Fastify
        working-directory: server
        run: |
          npm install fastify@^5.12.5
          npm ci

      - name: Verify dependencies
        working-directory: server
        run: |
          echo "=== fastify ==="
          npm ls fastify --all

          echo "=== fast-uri ==="
          npm ls fast-uri --all

      - name: Verify Frozen Core
        run: |
          if git diff --name-only | grep -E \
            '^(circuits/|artifacts/|keys/|wasm/|production\.zkey|publicSignals|contracts/)' \
            >/dev/null; then
            echo "ERROR: Frozen Core was modified."
            exit 1
          fi

          echo "OK: Frozen Core untouched."

      - name: Verify changed files
        run: |
          changed="$(git diff --name-only)"

          echo "$changed"

          if echo "$changed" | grep -vE \
            '^server/(package\.json|package-lock\.json)$' \
            >/dev/null; then
            echo "ERROR: Unexpected files changed."
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add server/package.json server/package-lock.json

          git commit \
            -m "fix(deps): update server fastify to resolve fast-uri vulnerability"

          git push
