```yaml
# ============================================================================
# AegisProof Reproducibility CI
# ----------------------------------------------------------------------------
# PR / PUSH:
#   - security boundary checks
#   - codegen determinism
#   - canonical artifact manifest verification
#   - standalone gates
#   - contract compilation
#   - FAST verification suite
#   - artifact resolution regression
#   - SDK / documentation readiness
#   - TEE regression
#   - prover compatibility
#   - hybrid-auth research regression
#
# WEEKLY / MANUAL:
#   - FULL verification suite
#   - prover benchmark
#   - provenance + PQC hardening
#   - full penetration suite
#   - Phase 8.13 regression
#   - extended hybrid-auth benchmark
#
# SECURITY MODEL:
#   - Frozen Core artifacts are NEVER regenerated by CI.
#   - CI verifies canonical artifacts against the committed manifest.
#   - Production trusted setup is NOT performed by CI.
#   - Live Vault / HSM / OIDC integration remains optional until promoted.
#   - PR-tier PQC provenance remains non-strict by design.
# ============================================================================

name: AegisProof Reproducibility CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly FULL run: Monday 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:

  # ==========================================================================
  # SECURITY BOUNDARY
  # ==========================================================================

  security-boundary-check:
    name: Security boundary gate (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Sensitive file boundary scan
        run: npm run check:sensitive-files

      - name: Sensitive file policy unit tests (T-SEC)
        run: npm run test:sensitive-files-boundary

      - name: Phase 8.13 gate metadata (T-813)
        run: npm run test:phase813-gate

      - name: Security penetration tests (PT-01–PT-10)
        run: npm run test:penetration

      - name: KMS signer abstraction tests (T-KMS)
        run: npm run test:kms-signer

      - name: KMS OIDC authentication tests (mocked)
        run: npm run test:kms-oidc

      - name: Verify production prover artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            artifactsReady,
            resolveArtifacts
          } from './scripts/lib/resolve-artifacts.mjs';

          const paths = resolveArtifacts();

          if (!artifactsReady()) {
            console.error('FAIL: prover artifacts missing after checkout.');

            for (const [name, path] of Object.entries({
              wasm: paths.wasm,
              zkey: paths.zkey,
              vkey: paths.vkey
            })) {
              console.error(
                `${name}: ${path} exists=${fs.existsSync(path)}`
              );
            }

            process.exit(1);
          }

          console.log('PASS: prover artifacts ready');
          console.log(paths);
          NODE

      - name: Artifact provenance verification
        run: npm run verify:provenance -- --live

      - name: Prover compatibility regression (T1–T9)
        run: npm run test:prover-compat


  # ==========================================================================
  # FAST REGRESSION
  # ==========================================================================

  fast:
    name: FAST gates + suite (30 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Codegen determinism (SSoT -> TS/Solidity constants)
        run: |
          node scripts/codegen_signals.mjs

          git diff --exit-code -- \
            generated/AegisSignals.ts \
            contracts/generated/AegisSignals.sol

      - name: Artifact manifest verification
        run: node scripts/verify_manifest.mjs

      - name: Standalone gates
        run: node scripts/gates/run_all.mjs

      - name: Hardhat compile
        run: npx hardhat compile

      - name: Verification suite — FAST
        run: node scripts/phase2_verify.mjs --fast --artifact-json

      - name: Artifact resolution regression
        run: npm run test:artifact-resolution

      - name: Upload FAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-evidence-fast
          path: |
            artifacts/phase2/reports/phase2_evidence_fast.json
            artifacts/phase2/reports/phase2_verify_run_fast.log
          if-no-files-found: warn


  # ==========================================================================
  # FULL VERIFICATION
  # ==========================================================================

  full:
    name: FULL suite (41 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Artifact manifest verification before verification
        run: node scripts/verify_manifest.mjs

      - name: Standalone gates before verification
        run: node scripts/gates/run_all.mjs

      - name: Verification suite — FULL
        run: node scripts/phase2_verify.mjs --full

      - name: Upload FULL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-evidence-full
          path: |
            artifacts/phase2/reports/phase2_evidence_full.json
            artifacts/phase2/reports/phase2_verify_run_full.log
          if-no-files-found: warn


  # ==========================================================================
  # PHASE 5 READINESS
  # ==========================================================================

  phase5-readiness:
    name: Phase 5 readiness (SDK + docs + artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: SDK package build
        working-directory: packages/sdk
        run: |
          npm ci
          npm run build

      - name: SDK pack dry-run
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Documentation link validation
        run: npm run validate:doc-links

      - name: Verify production prover artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            artifactsReady,
            resolveArtifacts
          } from './scripts/lib/resolve-artifacts.mjs';

          const paths = resolveArtifacts();

          if (!artifactsReady()) {
            console.error('FAIL: production prover artifacts are not resolvable.');

            for (const [name, path] of Object.entries({
              wasm: paths.wasm,
              zkey: paths.zkey,
              vkey: paths.vkey
            })) {
              console.error(
                `${name}: ${path} exists=${fs.existsSync(path)}`
              );
            }

            process.exit(1);
          }

          console.log('PASS: production prover artifacts resolved.');
          NODE


  # ==========================================================================
  # TEE REGRESSION
  # ==========================================================================

  tee-layer-regression:
    name: TEE Layer regression (Stages A–G, ADR-001 D8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TEE Adapter evaluation (Stages A–G)
        run: npx tsx tee/scripts/evaluate.ts


  # ==========================================================================
  # PROVER COMPATIBILITY
  # ==========================================================================

  prover-compatibility:
    name: Prover compatibility (snarkjs + optional rapidsnark)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Verify production prover artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            artifactsReady,
            resolveArtifacts
          } from './scripts/lib/resolve-artifacts.mjs';

          const paths = resolveArtifacts();

          if (!artifactsReady()) {
            console.error('FAIL: prover artifacts missing after checkout.');

            for (const [name, path] of Object.entries({
              wasm: paths.wasm,
              zkey: paths.zkey,
              vkey: paths.vkey
            })) {
              console.error(
                `${name}: ${path} exists=${fs.existsSync(path)}`
              );
            }

            process.exit(1);
          }

          console.log('PASS: prover artifacts ready');
          NODE

      - name: Compile production verifier
        run: npx hardhat compile --config scripts/hardhat-prover.config.ts

      - name: Install rapidsnark (optional)
        continue-on-error: true
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            libgmp-dev \
            libsodium-dev \
            nasm \
            curl \
            m4

          node scripts/install-rapidsnark.mjs

          echo \
            "RAPIDSNARK_BIN=${{ github.workspace }}/rapidsnark/package/bin/prover" \
            >> "$GITHUB_ENV"

      - name: Prover compatibility tests (T1–T9)
        run: npm run test:prover-compat

      - name: Artifact provenance check
        run: npm run verify:provenance -- --live

      - name: Artifact provenance unit tests
        run: npm run test:artifact-provenance

      - name: ML-DSA signature unit tests (T-PQC-01..10)
        run: npm run test:pqc-signature

      - name: Hybrid auth envelope research tests (T-AUTH-01..08)
        run: npm run test:hybrid-auth

      - name: rapidsnark evaluation (optional)
        continue-on-error: true
        run: npm run evaluate:rapidsnark

      - name: Benchmark drift check (warn-only)
        continue-on-error: true
        run: npm run check:bench-drift


  # ==========================================================================
  # PROVER BENCHMARK
  # ==========================================================================

  prover-benchmark:
    name: Prover benchmark (20 samples)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install rapidsnark (optional)
        continue-on-error: true
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            libgmp-dev \
            libsodium-dev \
            nasm \
            curl \
            m4

          node scripts/install-rapidsnark.mjs

          echo \
            "RAPIDSNARK_BIN=${{ github.workspace }}/rapidsnark/package/bin/prover" \
            >> "$GITHUB_ENV"

      - name: rapidsnark evaluation record
        continue-on-error: true
        run: npm run evaluate:rapidsnark

      - name: Run benchmark (20 samples)
        run: npm run bench:prover -- --samples 20

      - name: Benchmark drift check (warn-only)
        continue-on-error: true
        run: npm run check:bench-drift

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prover-benchmark-report
          path: |
            benchmarks/reports/prover-bench-*.json
            benchmarks/reports/baseline.json
            benchmarks/reports/rapidsnark-evaluation.json
          if-no-files-found: warn


  # ==========================================================================
  # PROVENANCE + PQC HARDENING
  # ==========================================================================

  provenance-pqc-hardening:
    name: Provenance PQC hardening (strict + production simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public key registry
        run: |
          test -f artifacts/provenance/public-keys/aegis-ci-mldsa87-v1.json

          node --input-type=module <<'NODE'
          import { loadRegistryPublicKey } from './scripts/lib/public-key-registry.mjs';

          const key = loadRegistryPublicKey('aegis-ci-mldsa87-v1');

          if (!key?.publicKey) {
            console.error('FAIL: registry public key unavailable');
            process.exit(1);
          }

          console.log(
            'PASS registry key:',
            key.keyId,
            key.algorithm,
            key.version
          );
          NODE

      - name: Generate ephemeral ML-DSA keys
        run: node scripts/generate-pqc-dev-keys.mjs ci-ephemeral

      - name: Strict provenance verification
        env:
          AEGIS_PQC_PRIVATE_KEY_PATH: >-
            ${{ github.workspace }}/artifacts/provenance/keys/ci-ephemeral.key.json
        run: npm run verify:provenance -- --live --pqc

      - name: Production simulation
        continue-on-error: true
        env:
          AEGIS_PQC_PRIVATE_KEY_HEX: ${{ secrets.AEGIS_PQC_PRIVATE_KEY_HEX }}
          AEGIS_PQC_PUBLIC_KEY_ID: aegis-ci-mldsa87-v1
        run: |
          if [ -z "$AEGIS_PQC_PRIVATE_KEY_HEX" ]; then
            echo "SKIP production simulation — secret not configured"
            exit 0
          fi

          npm run verify:provenance -- --live --require-pqc

      - name: Provenance verification benchmark
        run: npm run bench:provenance

      - name: ML-DSA regression tests
        run: npm run test:pqc-signature

      - name: Upload provenance benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-pqc-benchmark
          path: benchmarks/reports/provenance-verify-benchmark.json
          if-no-files-found: warn


  # ==========================================================================
  # SECURITY PENETRATION — FULL
  # ==========================================================================

  security-penetration-full:
    name: Security penetration full (schedule/manual + Shield live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Penetration tests (PT-01–PT-10)
        run: npm run test:penetration

      - name: AegisShield live penetration (PT-07)
        continue-on-error: true
        run: PT_RUN_SHIELD_LIVE=1 npm run test:penetration


  # ==========================================================================
  # PHASE 8.13 REGRESSION
  # ==========================================================================

  phase813-regression:
    name: Phase 8.13 unified regression (schedule/manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 8.13 unified regression
        run: npm run test:phase813


  # ==========================================================================
  # HYBRID AUTH RESEARCH
  # ==========================================================================

  hybrid-auth-research:
    name: Hybrid auth envelope research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hybrid auth unit tests (T-AUTH-01..08)
        run: npm run test:hybrid-auth

      - name: Full hybrid auth validation + benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run test:hybrid-auth
          npm run bench:hybrid-auth

      - name: Upload hybrid auth benchmark
        if: >
          always() &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-auth-benchmark
          path: benchmarks/reports/hybrid-auth-benchmark.json
          if-no-files-found: warn
```
