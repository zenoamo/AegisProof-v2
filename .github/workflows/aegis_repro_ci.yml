# ============================================================================
# AegisProof Reproducibility CI
# ============================================================================
#
# PUSH / PR
#   - security boundary checks
#   - production dependency boundary
#   - codegen determinism
#   - live artifact provenance verification
#   - standalone build gates
#   - Hardhat compilation
#   - FAST verification suite
#   - artifact resolution regression
#   - Phase 5 readiness
#   - TEE regression
#   - prover compatibility
#   - hybrid-auth regression
#   - Lean formal assurance
#
# WEEKLY / MANUAL
#   - FULL verification suite
#   - prover benchmark
#   - provenance + PQC hardening
#   - full penetration suite
#   - Phase 8.13 regression
#   - hybrid-auth benchmark
#
# SECURITY MODEL
#   - Frozen Core artifacts are not regenerated by CI.
#   - Production artifacts are verified against the canonical provenance
#     manifest and their expected hashes.
#   - Production trusted setup is never performed by CI.
#   - FULL verification may create/reuse ephemeral DEVELOPMENT setup only.
#   - PQC production simulation remains optional until its secret is configured.
#   - Lean is an independent formal-assurance layer; it does not replace
#     runtime, cryptographic, provenance, or integration verification.
#
# SUPPLY-CHAIN MODEL
#   - Production dependencies are audited with npm audit --omit=dev.
#   - circomlibjs is development/ZK tooling only and must not enter the
#     production dependency tree.
#   - elliptic is currently transitive through the development dependency
#     graph and must not enter the production dependency tree.
#   - The CI gate fails closed if elliptic or circomlibjs appears in the
#     production dependency tree.
#   - No unverified elliptic override/fork is used as a remediation.
# ============================================================================

name: AegisProof Reproducibility CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly FULL run: Monday 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: aegis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"

jobs:

  # ==========================================================================
  # SECURITY BOUNDARY
  # ==========================================================================

  security-boundary-check:
    name: Security boundary gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ----------------------------------------------------------------------
      # Production dependency security
      # ----------------------------------------------------------------------

      - name: Production dependency audit
        run: npm audit --omit=dev

      # SECURITY INVARIANT:
      # elliptic currently exists only in the development/ZK tooling graph.
      # circomlibjs is likewise development-only.
      #
      # This gate intentionally does NOT fail merely because elliptic exists
      # in the full development dependency tree. The security boundary is
      # production runtime dependency exposure.
      #
      # Do NOT replace elliptic with an arbitrary override/fork here.
      # There is currently no verified upstream patched elliptic release.
      - name: Elliptic production dependency boundary
        run: |
          set -euo pipefail

          echo "============================================"
          echo "AegisProof production dependency boundary"
          echo "============================================"

          echo
          echo "[1/2] Checking elliptic..."

          if npm ls elliptic --omit=dev --all >/tmp/aegis-elliptic-production.txt 2>&1; then
            echo "::error::elliptic is present in the production dependency tree"
            echo
            cat /tmp/aegis-elliptic-production.txt
            exit 1
          fi

          echo "PASS: elliptic is absent from production dependencies"

          echo
          echo "[2/2] Checking circomlibjs..."

          if npm ls circomlibjs --omit=dev --all >/tmp/aegis-circomlibjs-production.txt 2>&1; then
            echo "::error::circomlibjs is present in the production dependency tree"
            echo
            cat /tmp/aegis-circomlibjs-production.txt
            exit 1
          fi

          echo "PASS: circomlibjs is absent from production dependencies"

          echo
          echo "PASS: production dependency boundary is intact"

      # Existing repository-specific regression coverage.
      - name: Elliptic supply-chain regression
        run: npm run test:elliptic-supply-chain

      # ----------------------------------------------------------------------
      # Existing security boundary
      # ----------------------------------------------------------------------

      - name: Sensitive file boundary scan
        run: npm run check:sensitive-files

      - name: Sensitive file policy tests
        run: npm run test:sensitive-files-boundary

      - name: Phase 8.13 gate metadata
        run: npm run test:phase813-gate

      - name: Security penetration tests
        run: npm run test:penetration

      - name: KMS signer abstraction tests
        run: npm run test:kms-signer

      # NOTE:
      # Do NOT use specs/artifact-manifest.json here.
      # The canonical runtime verification path is the provenance verifier.
      - name: Live artifact provenance verification
        run: |
          if [[ -n "$AEGIS_PRODUCTION_ZKEY_PATH" ]]; then
            npm run verify:provenance -- --live --pqc
          else
            npm run verify:provenance -- --live --pqc --allow-missing-production-zkey
          fi

      - name: Compile prover verifier
        run: npx hardhat compile --config scripts/hardhat-prover.config.ts

      # Static hashes only. This PASS is not Groth16 regression PASS.
      - name: Frozen Core artifact integrity
        run: npm run verify:frozen-core-integrity


  # ==========================================================================
  # FAST REGRESSION
  # ==========================================================================

  fast:
    name: FAST gates + verification suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Codegen determinism
        run: |
          node scripts/codegen_signals.mjs

          git diff --exit-code -- \
            generated/AegisSignals.ts \
            protocol/contracts/generated/AegisSignals.sol \
            packages/sdk/src/generated/AegisSignals.ts

      # NOTE:
      # Do NOT call scripts/verify_manifest.mjs.
      # The canonical runtime verification path is the provenance verifier.
      - name: Live artifact provenance verification
        run: |
          if [[ -n "$AEGIS_PRODUCTION_ZKEY_PATH" ]]; then
            npm run verify:provenance -- --live --pqc
          else
            npm run verify:provenance -- --live --pqc --allow-missing-production-zkey
          fi

      - name: Standalone build gates
        run: node scripts/gates/run_all.mjs

      - name: Hardhat compile
        run: npx hardhat compile

      - name: Verification suite - FAST
        run: node scripts/phase2_verify.mjs --fast --artifact-json

      - name: Artifact resolution regression
        run: npm run test:artifact-resolution

      - name: Canonical v2 30-signal guard
        run: npm run test:canonical-v2-guard

      - name: Artifact provenance unit tests
        run: npm run test:artifact-provenance

      - name: ML-DSA provenance signature tests
        run: npm run test:pqc-signature

      - name: External provenance signing binding
        run: npm run test:external-provenance-signing

      - name: Production provenance provisioning boundary
        run: npm run test:production-provenance-provisioning

      - name: Production provenance final E2E
        id: production_e2e
        continue-on-error: true
        run: |
          set +e
          node scripts/verify-production-provenance-e2e.mjs
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "status=VERIFIED" >> "$GITHUB_OUTPUT"
            echo "production provenance: VERIFIED"
          elif [[ "$code" -eq 2 || "$code" -eq 3 ]]; then
            echo "status=NOT_RUN" >> "$GITHUB_OUTPUT"
            echo "Production provenance E2E: NOT RUN"
            echo "production provenance is not VERIFIED."
            exit "$code"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "Production provenance E2E: FAIL"
            exit 1
          fi

      - name: Fail when production provenance E2E failed
        if: steps.production_e2e.outputs.status == 'FAIL'
        run: |
          echo "Production provenance E2E: FAIL"
          exit 1

      - name: Record production provenance E2E NOT RUN
        if: steps.production_e2e.outputs.status == 'NOT_RUN'
        run: |
          echo "Production provenance E2E: NOT RUN"
          echo "PRODUCTION SIGNING KEY NOT PROVISIONED"
          echo "production provenance: NOT VERIFIED"
          echo "Production provenance E2E is not VERIFIED."

      - name: Upload FAST evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase2-evidence-fast
          path: |
            artifacts/phase2/reports/phase2_evidence_fast.json
            artifacts/phase2/reports/phase2_verify_run_fast.log
          if-no-files-found: warn


  # ==========================================================================
  # FULL VERIFICATION
  # ==========================================================================

  full:
    name: FULL verification + ephemeral development setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Live artifact provenance verification
        run: |
          if [[ -n "$AEGIS_PRODUCTION_ZKEY_PATH" ]]; then
            npm run verify:provenance -- --live --pqc
          else
            npm run verify:provenance -- --live --pqc --allow-missing-production-zkey
          fi

      - name: Standalone build gates
        run: node scripts/gates/run_all.mjs

      # phase2_verify --full owns the development setup lifecycle.
      # This is DEVELOPMENT setup only; CI never performs production trusted setup.
      - name: Verification suite - FULL
        run: node scripts/phase2_verify.mjs --full

      - name: Upload FULL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase2-evidence-full
          path: |
            artifacts/phase2/reports/phase2_evidence_full.json
            artifacts/phase2/reports/phase2_verify_run_full.log
          if-no-files-found: warn


  # ==========================================================================
  # PHASE 5 READINESS
  # ==========================================================================

  phase5-readiness:
    name: Phase 5 readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      # packages/sdk currently has no package-lock.json.
      # Therefore npm ci would fail here.
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm install --no-package-lock --ignore-scripts

      - name: SDK build
        working-directory: packages/sdk
        run: npm run build

      - name: SDK unit tests
        working-directory: packages/sdk
        run: npm test

      - name: SDK pack dry-run
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Documentation link validation
        run: npm run validate:doc-links

      # Production zkey is external. Verify it only when an operator-provisioned
      # absolute path is supplied on the runner.
      - name: Verify production prover artifacts
        if: env.AEGIS_PRODUCTION_ZKEY_PATH != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            resolveArtifacts,
            artifactsReady,
            assertProductionHashes,
          } from "./scripts/lib/resolve-artifacts.mjs";

          const paths = resolveArtifacts({
            production: true,
            profile: "production",
          });

          const required = {
            wasm: paths.wasm,
            witCalc: paths.witCalc,
            input: paths.input,
            zkey: paths.zkey,
            vkey: paths.vkey,
          };

          let missing = false;

          for (const [name, file] of Object.entries(required)) {
            const exists = fs.existsSync(file);
            console.log(`${name}: ${file} exists=${exists}`);

            if (!exists) {
              missing = true;
            }
          }

          if (missing || !artifactsReady(paths)) {
            console.error("FAIL: production prover artifacts are not ready.");
            process.exit(1);
          }

          const hashes = assertProductionHashes(paths);

          console.log("PASS: production prover artifacts verified");
          console.log("zkey SHA-256:", hashes.zkeyHash);
          console.log("vkey SHA-256:", hashes.vkHash);
          NODE


  # ==========================================================================
  # TEE REGRESSION
  # ==========================================================================

  tee-layer-regression:
    name: TEE Layer regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TEE Adapter evaluation
        run: npx tsx tee/scripts/evaluate.ts


  # ==========================================================================
  # PROVER COMPATIBILITY
  # ==========================================================================

  prover-compatibility:
    name: Prover compatibility
    # Always evaluates regression status on push/PR.
    # production.zkey stays outside the repository. NOT RUN is not PASS.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      regression_status: ${{ steps.groth16.outputs.status }}
    env:
      AEGIS_PRODUCTION_ZKEY_AVAILABLE: ${{ vars.AEGIS_PRODUCTION_ZKEY_AVAILABLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Verify production prover artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            resolveArtifacts,
            assertProductionHashes,
          } from "./scripts/lib/resolve-artifacts.mjs";
          import { classifyGroth16Regression } from "./scripts/lib/groth16-regression-gate.mjs";

          const paths = resolveArtifacts({
            production: true,
            profile: "production",
          });

          for (const name of ["wasm", "witCalc", "input", "zkey", "vkey"]) {
            const file = paths[name];
            console.log(`${name}: ${file} exists=${fs.existsSync(file)}`);
          }

          const decision = classifyGroth16Regression({ paths });
          if (decision.status === "NOT_RUN") {
            console.log("Groth16 regression: NOT RUN");
            console.log(`Reason: ${decision.reason}`);
            process.exit(0);
          }
          if (decision.status !== "RUN") {
            console.error("Groth16 regression: FAIL");
            console.error(`Reason: ${decision.reason}`);
            process.exit(1);
          }

          const hashes = assertProductionHashes(paths);
          console.log("production.zkey SHA-256 matches the pin");
          console.log("zkey SHA-256:", hashes.zkeyHash);
          console.log("vkey SHA-256:", hashes.vkHash);
          console.log("artifact source:", paths.sources);
          NODE

      - name: Frozen Core artifact integrity
        run: npm run verify:frozen-core-integrity

      - name: Compile prover verifier
        run: npx hardhat compile --config scripts/hardhat-prover.config.ts

      - name: Install rapidsnark (optional)
        continue-on-error: true
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            libgmp-dev \
            libsodium-dev \
            nasm \
            curl \
            m4

          node scripts/install-rapidsnark.mjs

          echo \
            "RAPIDSNARK_BIN=${{ github.workspace }}/rapidsnark/package/bin/prover" \
            >> "$GITHUB_ENV"

      - name: Groth16 regression
        id: groth16
        continue-on-error: true
        # npm script test:prover-compat is node scripts/run-prover-compat.mjs.
        # Call node directly so exit 2 (NOT RUN) is not remapped.
        run: |
          set +e
          node scripts/run-prover-compat.mjs
          code=$?
          set -e
          if [[ "$code" -eq 0 ]]; then
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "Groth16 regression: PASS"
          elif [[ "$code" -eq 2 ]]; then
            echo "status=NOT_RUN" >> "$GITHUB_OUTPUT"
            echo "Groth16 regression: NOT RUN"
            echo "Reason: production.zkey unavailable"
            echo "Groth16 regression is not PASS."
            exit 2
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "Groth16 regression: FAIL"
            exit 1
          fi

      - name: Fail when Groth16 regression executed and failed
        if: steps.groth16.outputs.status == 'FAIL'
        run: |
          echo "Groth16 regression: FAIL"
          exit 1

      - name: Record Groth16 regression NOT RUN
        if: steps.groth16.outputs.status == 'NOT_RUN'
        run: |
          echo "Groth16 regression: NOT RUN"
          echo "Reason: production.zkey unavailable"
          echo "Frozen Core artifact integrity is a separate result."
          echo "Groth16 regression is not PASS."

      - name: Artifact provenance verification
        if: steps.groth16.outputs.status == 'PASS'
        run: npm run verify:provenance -- --live --pqc

      - name: Artifact provenance verification without production zkey
        if: steps.groth16.outputs.status == 'NOT_RUN'
        run: npm run verify:provenance -- --live --pqc --allow-missing-production-zkey

      - name: Artifact provenance tests
        run: npm run test:artifact-provenance

      - name: ML-DSA signature tests
        run: npm run test:pqc-signature

      - name: Hybrid auth tests
        run: npm run test:hybrid-auth

      - name: rapidsnark evaluation (optional)
        continue-on-error: true
        run: npm run evaluate:rapidsnark

      - name: Benchmark drift check (warn-only)
        continue-on-error: true
        run: npm run check:bench-drift


  # ==========================================================================
  # FORMAL ASSURANCE
  # ==========================================================================

  formal-assurance:
    name: Lean formal assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y

          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean toolchain
        working-directory: formal
        run: |
          lean --version
          lake --version

      - name: Build formal assurance layer
        working-directory: formal
        run: lake build


  # ==========================================================================
  # PROVER BENCHMARK
  # ==========================================================================

  prover-benchmark:
    name: Prover benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install rapidsnark (optional)
        continue-on-error: true
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            libgmp-dev \
            libsodium-dev \
            nasm \
            curl \
            m4

          node scripts/install-rapidsnark.mjs

          echo \
            "RAPIDSNARK_BIN=${{ github.workspace }}/rapidsnark/package/bin/prover" \
            >> "$GITHUB_ENV"

      - name: rapidsnark evaluation
        continue-on-error: true
        run: npm run evaluate:rapidsnark

      - name: Run prover benchmark
        run: npm run bench:prover -- --samples 20

      - name: Benchmark drift check
        continue-on-error: true
        run: npm run check:bench-drift

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prover-benchmark-report
          path: |
            benchmarks/reports/prover-bench-*.json
            benchmarks/reports/baseline.json
            benchmarks/reports/rapidsnark-evaluation.json
          if-no-files-found: warn


  # ==========================================================================
  # PROVENANCE + PQC HARDENING
  # ==========================================================================

  provenance-pqc-hardening:
    name: Provenance PQC hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Repository operators must add the approved secure-storage provisioning
      # step before this preflight and export its absolute runner-local path as
      # AEGIS_PRODUCTION_ZKEY_PATH. No storage backend or credential contract is
      # currently committed, so this job remains fail-closed until configured.
      - name: Preflight externally provisioned production zkey
        run: npm run verify:production-zkey-path

      - name: Verify public key registry
        run: |
          test -f artifacts/provenance/public-keys/aegis-ci-mldsa87-v1.json

          node --input-type=module <<'NODE'
          import { loadRegistryPublicKey } from "./scripts/lib/public-key-registry.mjs";

          const key = loadRegistryPublicKey("aegis-ci-mldsa87-v1");

          if (!key?.publicKey) {
            console.error("FAIL: registry key");
            process.exit(1);
          }

          console.log(
            "PASS registry key:",
            key.keyId,
            key.algorithm,
            key.version
          );
          NODE

      - name: Generate ephemeral ML-DSA keys
        run: |
          node scripts/generate-pqc-dev-keys.mjs \
            ci-ephemeral \
            --write-public

      - name: Strict provenance verification
        env:
          AEGIS_PQC_PRIVATE_KEY_PATH: >-
            ${{ github.workspace }}/artifacts/provenance/keys/ci-ephemeral.key.json
        run: npm run verify:provenance -- --live --pqc

      - name: Production simulation
        continue-on-error: true
        env:
          AEGIS_PQC_PRIVATE_KEY_HEX: ${{ secrets.AEGIS_PQC_PRIVATE_KEY_HEX }}
          AEGIS_PQC_PUBLIC_KEY_ID: aegis-ci-mldsa87-v1
        run: |
          if [ -z "$AEGIS_PQC_PRIVATE_KEY_HEX" ]; then
            echo "SKIP: production simulation secret is not configured"
            exit 0
          fi

          npm run verify:provenance -- --live --pqc --require-pqc

      - name: Provenance verification benchmark
        run: npm run bench:provenance

      - name: ML-DSA regression tests
        run: npm run test:pqc-signature

      - name: Upload provenance benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-pqc-benchmark
          path: benchmarks/reports/provenance-verify-benchmark.json
          if-no-files-found: warn


  # ==========================================================================
  # SECURITY PENETRATION - FULL
  # ==========================================================================

  security-penetration-full:
    name: Security penetration full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Penetration tests
        run: npm run test:penetration

      - name: AegisShield live penetration
        continue-on-error: true
        run: PT_RUN_SHIELD_LIVE=1 npm run test:penetration


  # ==========================================================================
  # PHASE 8.13 REGRESSION
  # ==========================================================================

  phase813-regression:
    name: Phase 8.13 unified regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Phase 8.13 unified regression
        run: npm run test:phase813


  # ==========================================================================
  # HYBRID AUTH RESEARCH
  # ==========================================================================

  hybrid-auth-research:
    name: Hybrid auth envelope research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Hybrid auth unit tests
        run: npm run test:hybrid-auth

      - name: Hybrid auth benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run bench:hybrid-auth

      - name: Upload hybrid auth benchmark
        if: >
          always() &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hybrid-auth-benchmark
          path: benchmarks/reports/hybrid-auth-benchmark.json
          if-no-files-found: warn


  # ==========================================================================
  # REQUIRED CI GATE
  # ==========================================================================

  required-gate:
    name: Required CI gate

    needs:
      # PUSH / PR jobs
      - security-boundary-check
      - fast
      - phase5-readiness
      - tee-layer-regression
      - prover-compatibility
      - formal-assurance

      # ALL-EVENT job
      - hybrid-auth-research

      # WEEKLY / MANUAL jobs
      - full
      - prover-benchmark
      - provenance-pqc-hardening
      - security-penetration-full
      - phase813-regression

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}

          SECURITY_BOUNDARY: ${{ needs.security-boundary-check.result }}
          FAST: ${{ needs.fast.result }}
          PHASE5: ${{ needs.phase5-readiness.result }}
          TEE: ${{ needs.tee-layer-regression.result }}
          PROVER_COMPATIBILITY: ${{ needs.prover-compatibility.result }}
          REGRESSION_STATUS: ${{ needs.prover-compatibility.outputs.regression_status }}
          FORMAL_ASSURANCE: ${{ needs.formal-assurance.result }}
          HYBRID_AUTH: ${{ needs.hybrid-auth-research.result }}

          FULL: ${{ needs.full.result }}
          PROVER_BENCHMARK: ${{ needs.prover-benchmark.result }}
          PROVENANCE_PQC: ${{ needs.provenance-pqc-hardening.result }}
          SECURITY_PENETRATION_FULL: ${{ needs.security-penetration-full.result }}
          PHASE813: ${{ needs.phase813-regression.result }}

        run: |
          set -euo pipefail

          validate() {
            local name="$1"
            local result="$2"

            echo "${name}=${result}"

            if [[ "$result" != "success" ]]; then
              echo "ERROR: Required job '${name}' did not succeed"
              exit 1
            fi
          }

          echo "============================================"
          echo "AegisProof Required CI Gate"
          echo "event=${EVENT_NAME}"
          echo "============================================"

          case "$EVENT_NAME" in

            push|pull_request)
              echo "Validating PUSH / PR required jobs..."

              validate "security-boundary-check" "$SECURITY_BOUNDARY"
              validate "fast" "$FAST"
              validate "phase5-readiness" "$PHASE5"
              validate "tee-layer-regression" "$TEE"
              validate "formal-assurance" "$FORMAL_ASSURANCE"
              validate "hybrid-auth-research" "$HYBRID_AUTH"

              echo "prover-compatibility job=${PROVER_COMPATIBILITY}"
              echo "regression_status=${REGRESSION_STATUS}"

              if [[ "$REGRESSION_STATUS" == "PASS" ]]; then
                if [[ "$PROVER_COMPATIBILITY" != "success" ]]; then
                  echo "Groth16 regression: FAIL"
                  echo "ERROR: regression status PASS requires a successful prover-compatibility job"
                  exit 1
                fi
                echo "Groth16 regression: PASS"
                echo "✓ Required jobs passed and Groth16 regression ran"
              elif [[ "$REGRESSION_STATUS" == "NOT_RUN" ]]; then
                echo "Groth16 regression: NOT RUN"
                echo "Reason: production.zkey unavailable"
                echo "Groth16 regression is not PASS."
                echo "Frozen Core artifact integrity is reported separately by verify:frozen-core-integrity."
                echo "✓ Required non-regression jobs passed"
              else
                echo "Groth16 regression: FAIL"
                echo "ERROR: Groth16 regression did not report PASS or NOT RUN (job=${PROVER_COMPATIBILITY})"
                exit 1
              fi
              ;;

            schedule|workflow_dispatch)
              echo "Validating WEEKLY / MANUAL required jobs..."

              validate "full" "$FULL"
              validate "prover-benchmark" "$PROVER_BENCHMARK"
              validate "provenance-pqc-hardening" "$PROVENANCE_PQC"
              validate "security-penetration-full" "$SECURITY_PENETRATION_FULL"
              validate "phase813-regression" "$PHASE813"
              validate "hybrid-auth-research" "$HYBRID_AUTH"

              echo "✓ All WEEKLY / MANUAL required jobs passed"
              ;;

            *)
              echo "ERROR: Unsupported GitHub event: ${EVENT_NAME}"
              exit 1
              ;;

          esac