name: Update ws lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update ws lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update package-lock.json
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Show installed ws dependency tree
        run: |
          echo "Installed ws dependency tree:"
          npm ls ws

      - name: Verify patched ws version
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(
            await readFile("node_modules/ws/package.json", "utf8")
          );

          const version = packageJson.version;

          console.log(`Installed ws version: ${version}`);

          const [major, minor, patch] = version.split(".").map(Number);

          const patched =
            major > 8 ||
            (major === 8 && minor > 21) ||
            (major === 8 && minor === 21 && patch >= 0);

          if (!patched) {
            console.error(
              `ERROR: ws@8.21.0 or later is required, but found ws@${version}`
            );
            process.exit(1);
          }

          console.log("OK: ws@8.21.0 or later is installed.");
          EOF

      - name: Verify package-lock.json
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from "node:fs/promises";

          const lock = JSON.parse(
            await readFile("package-lock.json", "utf8")
          );

          const ws = lock.packages?.["node_modules/ws"];

          if (!ws) {
            console.error(
              "ERROR: node_modules/ws entry was not found in package-lock.json."
            );
            process.exit(1);
          }

          console.log(`Locked ws version: ${ws.version}`);

          const [major, minor, patch] = ws.version.split(".").map(Number);

          const patched =
            major > 8 ||
            (major === 8 && minor > 21) ||
            (major === 8 && minor === 21 && patch >= 0);

          if (!patched) {
            console.error(
              `ERROR: package-lock.json contains vulnerable ws version ${ws.version}`
            );
            process.exit(1);
          }

          console.log("OK: package-lock.json contains a patched ws version.");
          EOF

      - name: Verify dependency tree
        run: |
          npm ls ws --all

      - name: Check dependency changes
        run: |
          echo "Git status:"
          git status --short

          echo
          echo "Dependency diff:"
          git diff -- package.json package-lock.json

      - name: Ensure only dependency files changed
        run: |
          changed_files="$(git status --short | awk '{print $2}')"

          for file in $changed_files; do
            case "$file" in
              package.json|package-lock.json)
                ;;
              *)
                echo "ERROR: Unexpected modified file: $file"
                exit 1
                ;;
            esac
          done

          echo "OK: Only package.json/package-lock.json may be committed."

      - name: Commit dependency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No dependency changes detected."
            exit 0
          fi

          git commit -m "fix(deps): align ws override with hardhat"
          git push
