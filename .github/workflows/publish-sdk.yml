name: Publish AegisProof SDK

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aegisproof-sdk-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"

jobs:
  publish-sdk:
    name: Test, build and publish SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: "@zenoamo"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify package metadata
        working-directory: packages/sdk
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const expectedName = "@zenoamo/aegisproof-sdk";
          const expectedRegistry = "https://npm.pkg.github.com";

          if (pkg.name !== expectedName) {
            throw new Error(
              `Unexpected package name: ${pkg.name}`
            );
          }

          if (pkg.publishConfig?.registry !== expectedRegistry) {
            throw new Error(
              `Unexpected publish registry: ${pkg.publishConfig?.registry}`
            );
          }

          if (!pkg.version) {
            throw new Error("Package version is missing");
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${pkg.version}`);
          console.log(`Registry: ${pkg.publishConfig.registry}`);
          NODE

      - name: Test SDK
        working-directory: packages/sdk
        run: npm test

      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build

      - name: Verify build output
        working-directory: packages/sdk
        run: |
          test -f dist/core.js
          test -f dist/core.d.ts

          echo "Build output:"
          find dist -maxdepth 2 -type f -print | sort

      - name: Pack test
        working-directory: packages/sdk
        run: npm run pack-test

      - name: Publish SDK
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
