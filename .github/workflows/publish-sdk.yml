name: Publish AegisProof SDK

on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"

jobs:
  test-build-publish:
    name: Test, build and publish SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm install --no-package-lock --ignore-scripts

      - name: Test SDK
        working-directory: packages/sdk
        run: npm test

      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build

      - name: Inspect package
        working-directory: packages/sdk
        run: npm pack --dry-run

      - name: Verify package metadata
        working-directory: packages/sdk
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          if (!pkg.name.startsWith("@aegisproof/")) {
            throw new Error(
              `Invalid GitHub Packages scope: ${pkg.name}`
            );
          }

          if (!pkg.publishConfig?.registry) {
            throw new Error(
              "publishConfig.registry is missing"
            );
          }

          if (
            pkg.publishConfig.registry !==
            "https://npm.pkg.github.com"
          ) {
            throw new Error(
              `Unexpected registry: ${pkg.publishConfig.registry}`
            );
          }

          console.log("Package:", pkg.name);
          console.log("Version:", pkg.version);
          console.log(
            "Registry:",
            pkg.publishConfig.registry
          );
          NODE

      - name: Configure npm authentication
        working-directory: packages/sdk
        run: |
          cat > .npmrc <<'EOF'
          registry=https://registry.npmjs.org/
          @aegisproof:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          always-auth=true
          EOF

      - name: Publish SDK
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
