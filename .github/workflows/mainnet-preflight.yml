name: AegisProof Ethereum Mainnet Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mainnet-preflight:
    name: Mainnet preflight (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read-only Ethereum Mainnet deployer nonce probe
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          AEGIS_MAINNET_EXPECTED_DEPLOYER: ${{ secrets.AEGIS_MAINNET_EXPECTED_DEPLOYER }}
        run: node scripts/mainnet-nonce-probe.mjs

      - name: Read-only Ethereum Mainnet preflight
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          AEGIS_MAINNET_CANONICAL_VERIFIER: ${{ secrets.AEGIS_MAINNET_CANONICAL_VERIFIER }}
          AEGIS_MAINNET_CANONICAL_REGISTRY: ${{ secrets.AEGIS_MAINNET_CANONICAL_REGISTRY }}
          AEGIS_MAINNET_EXPECTED_DEPLOYER: ${{ secrets.AEGIS_MAINNET_EXPECTED_DEPLOYER }}
        run: node scripts/mainnet-preflight.mjs
