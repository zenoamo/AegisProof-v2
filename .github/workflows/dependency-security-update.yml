name: Dependency Security Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-security-update
  cancel-in-progress: false

jobs:
  security-update:
    name: Harden dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Node
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ============================================================
      # Root lockfile
      # ============================================================

      - name: Regenerate root lockfile
        run: |
          npm install --package-lock-only

      # ============================================================
      # Server lockfile
      # ============================================================

      - name: Regenerate server lockfile
        working-directory: server
        run: |
          npm install --package-lock-only

      # ============================================================
      # Lockfile consistency
      # ============================================================

      - name: Verify root lockfile
        run: |
          npm ci --dry-run

      - name: Verify server lockfile
        working-directory: server
        run: |
          npm ci --dry-run

      # ============================================================
      # Clean installation
      # ============================================================

      - name: Install root dependencies
        run: |
          npm ci

      - name: Install server dependencies
        working-directory: server
        run: |
          npm ci

      # ============================================================
      # Verify underscore
      # ============================================================

      - name: Verify underscore is patched
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          function getVersions(cwd) {
            try {
              const output = execFileSync(
                "npm",
                ["ls", "underscore", "--all", "--json"],
                {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"]
                }
              );

              const tree = JSON.parse(output);
              const versions = new Set();

              function walk(node) {
                if (!node) return;

                if (
                  node.name === "underscore" &&
                  node.version
                ) {
                  versions.add(node.version);
                }

                for (const dep of Object.values(
                  node.dependencies || {}
                )) {
                  walk(dep);
                }
              }

              walk(tree);

              return [...versions];
            } catch {
              return [];
            }
          }

          let failed = false;

          for (const [name, cwd] of [
            ["root", "."],
            ["server", "server"]
          ]) {
            const versions = getVersions(cwd);

            console.log(`${name} underscore:`, versions);

            for (const version of versions) {
              const match = version.match(
                /^(\d+)\.(\d+)\.(\d+)$/
              );

              if (!match) {
                console.error(
                  `ERROR: invalid underscore version: ${version}`
                );
                failed = true;
                continue;
              }

              const major = Number(match[1]);
              const minor = Number(match[2]);
              const patch = Number(match[3]);

              const patched =
                major > 1 ||
                (
                  major === 1 &&
                  (
                    minor > 13 ||
                    (minor === 13 && patch >= 8)
                  )
                );

              if (!patched) {
                console.error(
                  `ERROR: vulnerable underscore ${version}`
                );
                failed = true;
              }
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "OK: no vulnerable underscore version installed."
          );
          NODE

      # ============================================================
      # Verify fast-uri
      # ============================================================

      - name: Verify fast-uri is patched
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          function getVersions(cwd) {
            try {
              const output = execFileSync(
                "npm",
                ["ls", "fast-uri", "--all", "--json"],
                {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"]
                }
              );

              const tree = JSON.parse(output);
              const versions = new Set();

              function walk(node) {
                if (!node) return;

                if (
                  node.name === "fast-uri" &&
                  node.version
                ) {
                  versions.add(node.version);
                }

                for (const dep of Object.values(
                  node.dependencies || {}
                )) {
                  walk(dep);
                }
              }

              walk(tree);

              return [...versions];
            } catch {
              return [];
            }
          }

          function patched(version) {
            const match = version.match(
              /^(\d+)\.(\d+)\.(\d+)$/
            );

            if (!match) return false;

            const major = Number(match[1]);
            const minor = Number(match[2]);
            const patch = Number(match[3]);

            if (major === 2) {
              return (
                minor > 4 ||
                (minor === 4 && patch >= 7)
              );
            }

            if (major === 3) {
              return (
                minor > 1 ||
                (minor === 1 && patch >= 8)
              );
            }

            if (major === 4) {
              return (
                minor > 2 ||
                (minor === 2 && patch >= 1)
              );
            }

            return true;
          }

          let failed = false;

          for (const [name, cwd] of [
            ["root", "."],
            ["server", "server"]
          ]) {
            const versions = getVersions(cwd);

            console.log(`${name} fast-uri:`, versions);

            for (const version of versions) {
              if (!patched(version)) {
                console.error(
                  `ERROR: vulnerable fast-uri ${version}`
                );
                failed = true;
              }
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "OK: all fast-uri versions are patched."
          );
          NODE

      # ============================================================
      # Audit reports
      # ============================================================

      - name: Generate root audit report
        run: |
          npm audit --json > root-audit.json || true

      - name: Generate server audit report
        working-directory: server
        run: |
          npm audit --json > ../server-audit.json || true

      # ============================================================
      # Security gate
      #
      # Only GHSA-848j-6mx2-7j84 is permitted as a known
      # no-fix exception.
      #
      # Any other High/Critical vulnerability fails.
      # ============================================================

      - name: Enforce High/Critical security policy
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const reports = [
            ["root", "root-audit.json"],
            ["server", "server-audit.json"]
          ];

          const NO_FIX_EXCEPTIONS = new Set([
            "GHSA-848j-6mx2-7j84"
          ]);

          let failed = false;

          function getAdvisoryIds(via) {
            const ids = new Set();

            for (const item of via || []) {
              if (typeof item === "string") {
                ids.add(item);
                continue;
              }

              if (!item || typeof item !== "object") {
                continue;
              }

              if (item.source) {
                ids.add(String(item.source));
              }

              if (item.url) {
                const match = String(item.url).match(
                  /advisories\/(GHSA-[A-Za-z0-9-]+|CVE-[0-9-]+)/
                );

                if (match) {
                  ids.add(match[1]);
                }
              }
            }

            return [...ids];
          }

          for (const [scope, file] of reports) {
            if (!fs.existsSync(file)) {
              console.error(
                `ERROR: audit report missing: ${file}`
              );
              failed = true;
              continue;
            }

            const report = JSON.parse(
              fs.readFileSync(file, "utf8")
            );

            console.log(
              `\n=== ${scope.toUpperCase()} SECURITY AUDIT ===`
            );

            for (const [
              packageName,
              vulnerability
            ] of Object.entries(
              report.vulnerabilities || {}
            )) {
              const severity =
                vulnerability.severity;

              if (
                severity !== "high" &&
                severity !== "critical"
              ) {
                continue;
              }

              const ids = getAdvisoryIds(
                vulnerability.via
              );

              const isAllowedNoFix =
                ids.length > 0 &&
                ids.every(id =>
                  NO_FIX_EXCEPTIONS.has(id)
                );

              if (isAllowedNoFix) {
                console.warn(
                  `KNOWN NO-FIX: ${scope}/${packageName}`
                );
                console.warn(
                  ids.join(", ")
                );
                continue;
              }

              console.error(
                `SECURITY FAILURE: ${scope}/${packageName}`
              );
              console.error(
                `Severity: ${severity}`
              );
              console.error(
                `Advisories: ${
                  ids.join(", ") || "unknown"
                }`
              );

              failed = true;
            }
          }

          if (failed) {
            console.error(
              "\nSecurity gate FAILED."
            );
            process.exit(1);
          }

          console.log(
            "\nSecurity gate PASSED."
          );
          NODE

      # ============================================================
      # Frozen Core protection
      # ============================================================

      - name: Verify Frozen Core
        run: |
          changed="$(git diff --name-only)"

          echo "=== Changed files ==="
          echo "$changed"

          if echo "$changed" | grep -E \
            '^(circuits/|artifacts/|keys/|wasm/|production\.zkey|publicSignals|contracts/)' \
            >/dev/null; then

            echo "ERROR: Frozen Core modification detected."
            exit 1
          fi

          echo "OK: Frozen Core untouched."

      # ============================================================
      # Dependency boundary
      # ============================================================

      - name: Verify dependency-only changes
        run: |
          changed="$(git diff --name-only)"

          if [ -z "$changed" ]; then
            echo "No changes detected."
            exit 0
          fi

          echo "$changed"

          if echo "$changed" | grep -vE \
            '^(package\.json|package-lock\.json|server/package\.json|server/package-lock\.json)$' \
            >/dev/null; then

            echo "ERROR: unexpected file modification."
            exit 1
          fi

          echo "OK: dependency files only."

      # ============================================================
      # Branch
      # ============================================================

      - name: Create security branch
        run: |
          BRANCH="security/dependency-update-$(date +%Y%m%d-%H%M%S)"

          git checkout -b "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            server/package.json \
            server/package-lock.json

          git commit \
            -m "fix(deps): harden dependency security"

      # ============================================================
      # Push
      # ============================================================

      - name: Push branch
        run: |
          git push \
            --set-upstream origin "$BRANCH"

      # ============================================================
      # Pull Request
      # ============================================================

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > pr-body.md <<'EOF'
          ## Dependency Security Hardening

          Automated dependency security update.

          ### Security controls

          - patched `underscore` enforcement
          - patched `fast-uri` verification
          - clean `npm ci`
          - lockfile consistency verification
          - High/Critical security gate
          - Frozen Core protection
          - dependency-only change boundary

          ### Known no-fix advisory

          `GHSA-848j-6mx2-7j84` (`elliptic`) is explicitly tracked
          as a known advisory for which no patched release is currently
          available.

          This exception applies only to that exact advisory.

          Any other High/Critical vulnerability fails the workflow.

          ### Frozen Core

          Verified untouched.

          ### Merge

          This workflow creates a PR targeting `master`.
          Repository rulesets and the existing CI remain authoritative.
          EOF

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "fix(deps): harden dependency security" \
            --body-file pr-body.md
