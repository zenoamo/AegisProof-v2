name: Dependency Security Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-security-update
  cancel-in-progress: false

jobs:
  update:
    name: Update vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create update branch
        run: |
          set -euo pipefail
          BRANCH="security/dependency-update-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------------------------
      # ROOT
      # ------------------------------------------------------------

      - name: Refresh root dependency tree
        run: |
          set -euo pipefail

          npm update --package-lock-only
          npm audit fix --package-lock-only

      # ------------------------------------------------------------
      # SERVER
      # ------------------------------------------------------------

      - name: Update server Fastify
        working-directory: server
        run: |
          set -euo pipefail

          # Fastify is the parent that brings fast-uri into the server tree.
          # Keep this within the existing Fastify major version.
          npm install fastify@^5.12.5 --package-lock-only

          # Refresh all transitive packages within declared semver ranges.
          npm update --package-lock-only

          npm audit fix --package-lock-only

      # ------------------------------------------------------------
      # INSTALL FROM LOCKFILES
      # ------------------------------------------------------------

      - name: Install root dependencies from lockfile
        run: |
          set -euo pipefail
          npm ci

      - name: Install server dependencies from lockfile
        working-directory: server
        run: |
          set -euo pipefail
          npm ci

      # ------------------------------------------------------------
      # TREE INSPECTION
      # ------------------------------------------------------------

      - name: Inspect vulnerable dependency trees
        run: |
          set -euo pipefail

          echo "=== ROOT fast-uri ==="
          npm ls fast-uri --all || true

          echo
          echo "=== ROOT brace-expansion ==="
          npm ls brace-expansion --all || true

          echo
          echo "=== ROOT undici ==="
          npm ls undici --all || true

          echo
          echo "=== SERVER fastify ==="
          npm --prefix server ls fastify --all || true

          echo
          echo "=== SERVER fast-uri ==="
          npm --prefix server ls fast-uri --all || true

          echo
          echo "=== SERVER brace-expansion ==="
          npm --prefix server ls brace-expansion --all || true

          echo
          echo "=== SERVER undici ==="
          npm --prefix server ls undici --all || true

      # ------------------------------------------------------------
      # HARD VERSION FLOOR CHECKS
      # ------------------------------------------------------------

      - name: Verify server Fastify version
        working-directory: server
        run: |
          set -euo pipefail

          node <<'NODE'
          const { execSync } = require("node:child_process");

          const out = execSync("npm ls fastify --json", {
            encoding: "utf8"
          });

          const tree = JSON.parse(out);
          const version = tree.dependencies?.fastify?.version;

          if (!version) {
            throw new Error("Fastify is not installed");
          }

          const [major, minor, patch] = version.split(".").map(Number);

          if (
            major < 5 ||
            (major === 5 && minor < 12) ||
            (major === 5 && minor === 12 && patch < 5)
          ) {
            throw new Error(`Server Fastify ${version} is below required 5.12.5`);
          }

          console.log(`OK: server Fastify ${version}`);
          NODE

      - name: Verify patched fast-uri versions
        run: |
          set -euo pipefail

          node <<'NODE'
          const { execSync } = require("node:child_process");

          function collect(cwd) {
            const raw = execSync("npm ls fast-uri --all --json", {
              cwd,
              encoding: "utf8"
            });

            const tree = JSON.parse(raw);
            const versions = new Set();

            function walk(node) {
              if (!node || typeof node !== "object") return;

              if (node.dependencies) {
                for (const [name, dep] of Object.entries(node.dependencies)) {
                  if (name === "fast-uri" && dep.version) {
                    versions.add(dep.version);
                  }
                  walk(dep);
                }
              }
            }

            walk(tree);
            return [...versions];
          }

          function check(label, versions) {
            console.log(`${label}:`, versions);

            for (const version of versions) {
              const [major, minor, patch] = version.split(".").map(Number);

              const patched =
                (major === 2 && (minor > 4 || (minor === 4 && patch >= 6))) ||
                (major === 3 && (minor > 1 || (minor === 1 && patch >= 7))) ||
                (major === 4 && (minor > 1 || (minor === 1 && patch >= 4)));

              if (!patched) {
                throw new Error(
                  `${label}: vulnerable fast-uri version detected: ${version}`
                );
              }
            }
          }

          check("root", collect("."));
          check("server", collect("./server"));

          console.log("OK: all installed fast-uri versions satisfy current security floors");
          NODE

      # ------------------------------------------------------------
      # AUDIT REPORTS
      # ------------------------------------------------------------

      - name: Generate root audit report
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/root-audit.json" || true

      - name: Generate server audit report
        working-directory: server
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/server-audit.json" || true

      # ------------------------------------------------------------
      # STRICT SECURITY POLICY
      #
      # High/Critical findings with an available fix MUST fail.
      #
      # A known advisory with fixAvailable === false may remain only
      # when explicitly documented here.
      # ------------------------------------------------------------

      - name: Enforce high/critical security policy
        env:
          ROOT_AUDIT: ${{ runner.temp }}/root-audit.json
          SERVER_AUDIT: ${{ runner.temp }}/server-audit.json
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const allowedNoFix = new Set([
            "GHSA-848j-6mx2-7j84"
          ]);

          const reports = [
            ["root", process.env.ROOT_AUDIT],
            ["server", process.env.SERVER_AUDIT]
          ];

          let failed = false;

          for (const [scope, file] of reports) {
            const audit = JSON.parse(fs.readFileSync(file, "utf8"));

            for (const [name, vulnerability] of Object.entries(
              audit.vulnerabilities || {}
            )) {
              const severity = vulnerability.severity;

              if (severity !== "high" && severity !== "critical") {
                continue;
              }

              const advisoryIds = new Set();

              for (const item of vulnerability.via || []) {
                if (typeof item === "string") {
                  advisoryIds.add(item);
                } else if (item && typeof item === "object") {
                  if (item.source) advisoryIds.add(String(item.source));
                  if (item.url?.includes("GHSA-")) {
                    const match = item.url.match(/GHSA-[a-z0-9-]+/i);
                    if (match) advisoryIds.add(match[0]);
                  }
                }
              }

              const fixAvailable = vulnerability.fixAvailable;

              const onlyKnownNoFix =
                fixAvailable === false &&
                advisoryIds.size > 0 &&
                [...advisoryIds].every(id => allowedNoFix.has(id));

              if (onlyKnownNoFix) {
                console.log(
                  `WARNING: ${scope}/${name} has a known high/critical advisory with no available fix:`,
                  [...advisoryIds].join(", ")
                );
                continue;
              }

              console.error(
                `SECURITY FAILURE: ${scope}/${name}`
              );
              console.error(`Severity: ${severity}`);
              console.error(
                `Fix available: ${JSON.stringify(fixAvailable)}`
              );
              console.error(
                `Advisories: ${[...advisoryIds].join(", ")}`
              );

              failed = true;
            }
          }

          if (failed) {
            throw new Error(
              "Security gate failed: fixable high/critical vulnerabilities remain."
            );
          }

          console.log("OK: no fixable high/critical vulnerabilities remain.");
          NODE

      # ------------------------------------------------------------
      # FROZEN CORE PROTECTION
      # ------------------------------------------------------------

      - name: Frozen Core protection
        run: |
          set -euo pipefail

          forbidden_regex='^(circuits/|artifacts/|keys/|.*production\.zkey$|.*\.wasm$|.*\.r1cs$)'

          changed="$(git status --porcelain=v1 | awk '{print substr($0,4)}')"

          if [ -n "$changed" ]; then
            echo "Changed files:"
            printf '%s\n' "$changed"

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              if [[ "$file" =~ $forbidden_regex ]]; then
                echo "FROZEN CORE VIOLATION: $file"
                exit 1
              fi
            done <<< "$changed"
          fi

          echo "OK: Frozen Core untouched."

      # ------------------------------------------------------------
      # CHANGE BOUNDARY
      # ------------------------------------------------------------

      - name: Enforce dependency-only change boundary
        run: |
          set -euo pipefail

          changed="$(git status --porcelain=v1 | awk '{print substr($0,4)}')"

          if [ -z "$changed" ]; then
            echo "No dependency changes were produced."
            exit 1
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              package.json|package-lock.json|server/package.json|server/package-lock.json)
                ;;
              *)
                echo "UNAUTHORIZED CHANGE: $file"
                exit 1
                ;;
            esac
          done <<< "$changed"

          echo "OK: only dependency manifests and lockfiles changed."

      # ------------------------------------------------------------
      # COMMIT + PR
      # ------------------------------------------------------------

      - name: Commit dependency update
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json server/package.json server/package-lock.json

          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 1
          fi

          git commit -m "fix(deps): remediate vulnerable dependency tree"

      - name: Push update branch
        run: |
          set -euo pipefail
          git push --set-upstream origin "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "fix(deps): remediate vulnerable dependency tree" \
            --body "$(cat <<'EOF'
          ## Dependency security update

          This PR was generated by the dependency security workflow.

          ### Scope

          - refresh root dependency tree
          - update server Fastify within the existing v5 line
          - refresh transitive dependencies
          - regenerate package lockfiles
          - install from lockfiles with `npm ci`
          - enforce high/critical audit policy
          - verify patched `fast-uri`
          - protect Frozen Core artifacts

          ### Security boundary

          Frozen Core artifacts and circuit files are not modified.

          The PR must pass the repository's normal CI/security checks and
          the `master` ruleset before merge.
          EOF
          )"
