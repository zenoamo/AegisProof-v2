name: Dependency Security Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-security-update
  cancel-in-progress: false

jobs:
  security-update:
    name: Harden npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Node.js
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ============================================================
      # Update root lockfile
      # ============================================================

      - name: Update root dependencies
        run: |
          npm audit fix --package-lock-only

      # ============================================================
      # Update server lockfile
      # ============================================================

      - name: Update server dependencies
        working-directory: server
        run: |
          npm audit fix --package-lock-only

      # ============================================================
      # Verify lockfiles
      # ============================================================

      - name: Verify root lockfile
        run: |
          npm ci --dry-run

      - name: Verify server lockfile
        working-directory: server
        run: |
          npm ci --dry-run

      # ============================================================
      # Clean installation
      # ============================================================

      - name: Install root dependencies
        run: |
          npm ci

      - name: Install server dependencies
        working-directory: server
        run: |
          npm ci

      # ============================================================
      # Dependency tree diagnostics
      # ============================================================

      - name: Inspect root security dependencies
        run: |
          echo "=== fast-uri ==="
          npm ls fast-uri --all || true

          echo "=== brace-expansion ==="
          npm ls brace-expansion --all || true

          echo "=== undici ==="
          npm ls undici --all || true

          echo "=== underscore ==="
          npm ls underscore --all || true

          echo "=== elliptic ==="
          npm ls elliptic --all || true

      - name: Inspect server security dependencies
        working-directory: server
        run: |
          echo "=== fast-uri ==="
          npm ls fast-uri --all || true

          echo "=== brace-expansion ==="
          npm ls brace-expansion --all || true

          echo "=== undici ==="
          npm ls undici --all || true

          echo "=== underscore ==="
          npm ls underscore --all || true

          echo "=== elliptic ==="
          npm ls elliptic --all || true

      # ============================================================
      # Verify fast-uri
      # ============================================================

      - name: Verify fast-uri patched versions
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          function getVersions(cwd) {
            try {
              const output = execFileSync(
                "npm",
                ["ls", "fast-uri", "--all", "--json"],
                {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"]
                }
              );

              const tree = JSON.parse(output);
              const versions = new Set();

              function walk(node) {
                if (!node) return;

                if (
                  node.name === "fast-uri" &&
                  node.version
                ) {
                  versions.add(node.version);
                }

                for (const dep of Object.values(
                  node.dependencies || {}
                )) {
                  walk(dep);
                }
              }

              walk(tree);
              return [...versions].sort();
            } catch {
              return [];
            }
          }

          function isPatched(version) {
            const match = version.match(
              /^(\d+)\.(\d+)\.(\d+)$/
            );

            if (!match) return false;

            const major = Number(match[1]);
            const minor = Number(match[2]);
            const patch = Number(match[3]);

            if (major === 2) {
              return (
                minor > 4 ||
                (minor === 4 && patch >= 7)
              );
            }

            if (major === 3) {
              return (
                minor > 1 ||
                (minor === 1 && patch >= 8)
              );
            }

            if (major === 4) {
              return (
                minor > 2 ||
                (minor === 2 && patch >= 1)
              );
            }

            return true;
          }

          let failed = false;

          for (const [scope, cwd] of [
            ["root", "."],
            ["server", "server"]
          ]) {
            const versions = getVersions(cwd);

            console.log(
              `${scope} fast-uri versions:`,
              versions
            );

            for (const version of versions) {
              if (!isPatched(version)) {
                console.error(
                  `VULNERABLE fast-uri: ${scope} ${version}`
                );
                failed = true;
              }
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "OK: all installed fast-uri versions are patched."
          );
          NODE

      # ============================================================
      # Verify underscore
      # ============================================================

      - name: Verify underscore patched version
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          function getVersions(cwd) {
            try {
              const output = execFileSync(
                "npm",
                ["ls", "underscore", "--all", "--json"],
                {
                  cwd,
                  encoding: "utf8",
                  stdio: ["ignore", "pipe", "pipe"]
                }
              );

              const tree = JSON.parse(output);
              const versions = new Set();

              function walk(node) {
                if (!node) return;

                if (
                  node.name === "underscore" &&
                  node.version
                ) {
                  versions.add(node.version);
                }

                for (const dep of Object.values(
                  node.dependencies || {}
                )) {
                  walk(dep);
                }
              }

              walk(tree);
              return [...versions].sort();
            } catch {
              return [];
            }
          }

          function isPatched(version) {
            const match = version.match(
              /^(\d+)\.(\d+)\.(\d+)$/
            );

            if (!match) return false;

            const major = Number(match[1]);
            const minor = Number(match[2]);
            const patch = Number(match[3]);

            return (
              major > 1 ||
              (
                major === 1 &&
                (
                  minor > 13 ||
                  (minor === 13 && patch >= 8)
                )
              )
            );
          }

          let failed = false;

          for (const [scope, cwd] of [
            ["root", "."],
            ["server", "server"]
          ]) {
            const versions = getVersions(cwd);

            console.log(
              `${scope} underscore versions:`,
              versions
            );

            for (const version of versions) {
              if (!isPatched(version)) {
                console.error(
                  `VULNERABLE underscore: ${scope} ${version}`
                );
                failed = true;
              }
            }
          }

          if (failed) {
            process.exit(1);
          }

          console.log(
            "OK: all installed underscore versions are patched."
          );
          NODE

      # ============================================================
      # Audit reports
      # ============================================================

      - name: Generate root audit report
        run: |
          npm audit --json > root-audit.json || true

      - name: Generate server audit report
        working-directory: server
        run: |
          npm audit --json > ../server-audit.json || true

      # ============================================================
      # Security policy
      #
      # Only the exact elliptic advisory below is currently allowed
      # as a documented no-fix exception.
      #
      # Everything else High/Critical FAILS.
      # ============================================================

      - name: Enforce security policy
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const reports = [
            ["root", "root-audit.json"],
            ["server", "server-audit.json"]
          ];

          const NO_FIX_EXCEPTIONS = new Set([
            "GHSA-848j-6mx2-7j84"
          ]);

          let failed = false;

          function extractAdvisories(vulnerability) {
            const ids = new Set();

            const via = vulnerability?.via || [];

            for (const item of via) {
              if (typeof item === "string") {
                ids.add(item);
                continue;
              }

              if (!item || typeof item !== "object") {
                continue;
              }

              if (item.source) {
                ids.add(String(item.source));
              }

              if (item.url) {
                const match = String(item.url).match(
                  /advisories\/(GHSA-[A-Za-z0-9-]+|CVE-[0-9-]+)/
                );

                if (match) {
                  ids.add(match[1]);
                }
              }
            }

            return [...ids];
          }

          for (const [scope, filename] of reports) {
            if (!fs.existsSync(filename)) {
              console.error(
                `ERROR: missing audit report: ${filename}`
              );
              failed = true;
              continue;
            }

            const report = JSON.parse(
              fs.readFileSync(filename, "utf8")
            );

            console.log(
              `\n=== ${scope.toUpperCase()} SECURITY AUDIT ===`
            );

            for (const [
              packageName,
              vulnerability
            ] of Object.entries(
              report.vulnerabilities || {}
            )) {
              const severity =
                vulnerability.severity;

              if (
                severity !== "high" &&
                severity !== "critical"
              ) {
                continue;
              }

              const advisories =
                extractAdvisories(vulnerability);

              const exception =
                advisories.length > 0 &&
                advisories.every(id =>
                  NO_FIX_EXCEPTIONS.has(id)
                );

              if (exception) {
                console.warn(
                  `KNOWN NO-FIX EXCEPTION: ${scope}/${packageName}`
                );

                console.warn(
                  `Advisories: ${advisories.join(", ")}`
                );

                continue;
              }

              console.error(
                `SECURITY FAILURE: ${scope}/${packageName}`
              );

              console.error(
                `Severity: ${severity}`
              );

              console.error(
                `Advisories: ${
                  advisories.join(", ") || "unknown"
                }`
              );

              failed = true;
            }
          }

          if (failed) {
            console.error(
              "\nSECURITY GATE FAILED."
            );

            process.exit(1);
          }

          console.log(
            "\nSECURITY GATE PASSED."
          );
          NODE

      # ============================================================
      # Frozen Core protection
      # ============================================================

      - name: Verify Frozen Core
        run: |
          changed="$(git diff --name-only)"

          echo "=== Changed files ==="
          echo "$changed"

          if echo "$changed" | grep -E \
            '^(circuits/|artifacts/|keys/|wasm/|production\.zkey|publicSignals|contracts/)' \
            >/dev/null; then

            echo "ERROR: Frozen Core modification detected."
            exit 1
          fi

          echo "OK: Frozen Core untouched."

      # ============================================================
      # Changed-file boundary
      # ============================================================

      - name: Verify changed files
        run: |
          changed="$(git diff --name-only)"

          if [ -z "$changed" ]; then
            echo "No changes detected."
            exit 0
          fi

          echo "$changed"

          if echo "$changed" | grep -vE \
            '^(package\.json|package-lock\.json|server/package\.json|server/package-lock\.json)$' \
            >/dev/null; then

            echo "ERROR: unexpected file modification detected."
            exit 1
          fi

          echo "OK: dependency files only."

      # ============================================================
      # Create branch
      # ============================================================

      - name: Create security branch
        run: |
          BRANCH="security/dependency-update-$(date +%Y%m%d-%H%M%S)"

          git checkout -b "$BRANCH"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit dependency changes
        run: |
          if git diff --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            server/package.json \
            server/package-lock.json

          git commit \
            -m "fix(deps): harden dependency security"

      # ============================================================
      # Push branch
      # ============================================================

      - name: Push security branch
        run: |
          git push \
            --set-upstream origin "$BRANCH"

      # ============================================================
      # Pull Request
      # ============================================================

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > pr-body.md <<'EOF'
          ## Dependency Security Hardening

          Automated npm dependency security update.

          ### Security controls

          - npm audit fix --package-lock-only
          - clean npm ci
          - fast-uri patched-version verification
          - underscore patched-version verification
          - High/Critical security gate
          - Frozen Core protection
          - dependency-only change boundary

          ### Known no-fix exception

          `GHSA-848j-6mx2-7j84` (`elliptic`) is currently tracked as
          a known advisory without an available patched release.

          This exception applies only to that exact advisory.

          Any other High/Critical vulnerability fails the workflow.

          ### Frozen Core

          Frozen Core was verified to remain untouched.

          ### Merge

          This workflow creates a PR targeting `master`.
          Repository rulesets and the existing CI remain authoritative.
          EOF

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "fix(deps): harden dependency security" \
            --body-file pr-body.md
