# Protected live KMS smoke test — workflow_dispatch only (Phase 8.14 Task 4).
# Does NOT run on PR. Requires protected environment secrets (VAULT_ADDR, etc.).
# The self-hosted kms-signer runner must have OpenSSL 3.5 and the ML-DSA-87
# private key provisioned locally; the key never enters GitHub Actions.
name: KMS Live Smoke

on:
  workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  kms-live-smoke:
    name: OIDC → Vault → local OpenSSL → sign → verify
    runs-on: [self-hosted, linux, kms-signer]
    environment: kms-live-smoke
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate local signer prerequisites
        env:
          LOCAL_OPENSSL_PRIVATE_KEY_PATH: /etc/aegis/kms/aegis-ci-mldsa87-v1.pem
          OPENSSL_BIN: /opt/openssl-3.5/bin/openssl
          LD_LIBRARY_PATH: /opt/openssl-3.5/lib64
        run: |
          test -f "$LOCAL_OPENSSL_PRIVATE_KEY_PATH" || { echo "FAIL private key not provisioned"; exit 1; }
          test -x "$OPENSSL_BIN" || { echo "FAIL OpenSSL 3.5 binary not provisioned"; exit 1; }
          "$OPENSSL_BIN" version

      - name: Start local OpenSSL signer
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          LOCAL_OPENSSL_KEY_ID: aegis-ci-mldsa87-v1
          LOCAL_OPENSSL_PRIVATE_KEY_PATH: /etc/aegis/kms/aegis-ci-mldsa87-v1.pem
          OPENSSL_BIN: /opt/openssl-3.5/bin/openssl
          LD_LIBRARY_PATH: /opt/openssl-3.5/lib64
          LOCAL_OPENSSL_SIGNER_PORT: 8787
        run: |
          nohup node scripts/local-openssl-signer.mjs > "$RUNNER_TEMP/local-openssl-signer.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/local-openssl-signer.pid"
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/healthz > "$RUNNER_TEMP/local-openssl-healthz.json"; then
              cat "$RUNNER_TEMP/local-openssl-healthz.json"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/local-openssl-signer.log"
          exit 1

      - name: OIDC context preflight (presence only)
        run: |
          node --input-type=module -e "
          import { reportOidcEnvPresence, diagnoseOidcContext } from './scripts/lib/kms-backends/vault-auth.mjs';
          const presence = reportOidcEnvPresence();
          for (const [k, v] of Object.entries(presence)) console.log(k + ': ' + v);
          const d = diagnoseOidcContext();
          if (!d.ok) {
            console.error('OIDC preflight: ' + d.code);
            console.error(d.hint ?? '');
            process.exit(1);
          }
          console.log('OIDC preflight: context ready');
          "

      - name: KMS live smoke (OIDC → Vault → local OpenSSL ML-DSA-87)
        env:
          KMS_BACKEND_MODE: live
          AEGIS_PROVENANCE_SIGNING: kms
          AEGIS_PROVENANCE_BACKEND: local-openssl
          LOCAL_OPENSSL_SIGNER_URL: http://127.0.0.1:8787
          LOCAL_OPENSSL_KEY_ID: aegis-ci-mldsa87-v1
          AEGIS_PROVENANCE_KEY_ID: aegis-ci-mldsa87-v1
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_JWT_ROLE: ci-provenance-signer
          VAULT_TRANSIT_MOUNT: transit
          KMS_OIDC_EXPECT_REPOSITORY: ${{ github.repository }}
          KMS_OIDC_EXPECT_OWNER: ${{ github.repository_owner }}
          KMS_OIDC_EXPECT_REF: ${{ github.ref }}
          KMS_OIDC_EXPECT_WORKFLOW: KMS Live Smoke
          KMS_OIDC_EXPECT_ENVIRONMENT: kms-live-smoke
        run: node scripts/run-kms-live-smoke.mjs

      - name: Stop local OpenSSL signer
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/local-openssl-signer.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/local-openssl-signer.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/local-openssl-signer.log" ]; then
            cat "$RUNNER_TEMP/local-openssl-signer.log"
          fi
