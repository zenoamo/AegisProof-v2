name: Debug ws dependency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect ws dependency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show ws dependency tree
        run: npm ls ws || true

      - name: Explain ws dependency
        run: npm explain ws || true

      - name: Check installed ws version
        run: |
          node -e "
            try {
              const p = require('./node_modules/ws/package.json');
              console.log('Installed ws:', p.version);
            } catch (e) {
              console.log('ws is not installed at root');
            }
          "

      - name: Audit ws
        run: npm audit --json > audit.json || true

      - name: Show ws-related audit entries
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';

          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulnerabilities = audit.vulnerabilities ?? {};

          for (const [name, data] of Object.entries(vulnerabilities)) {
            if (name === 'ws' || JSON.stringify(data).includes('"ws"')) {
              console.log(`=== ${name} ===`);
              console.log(JSON.stringify(data, null, 2));
            }
          }
          EOF
