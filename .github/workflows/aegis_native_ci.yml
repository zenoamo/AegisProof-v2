name: AegisProof Native CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-ci:
    name: AegisProof Native CI
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run repository-owned CI gates
        run: npm run ci:native

      - name: Upload native CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-native-ci-evidence
          path: artifacts/ci/aegis-ci-report.json
          if-no-files-found: error
